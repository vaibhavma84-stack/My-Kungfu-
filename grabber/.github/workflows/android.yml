name: Build Grabber APK

# This is the workflow for the standalone grabber repository. While the app is
# staged inside My-Kungfu- it is built by .github/workflows/grabber.yml at that
# repository's root instead, which is artifact-only: the deck log there already
# owns the "latest" release tag and deletes it before each of its own releases,
# so a second workflow publishing to it would destroy the deck log's release.
# Here, in a repository of its own, nothing competes for the tag.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NAME: v${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # A wrongly signed APK builds green, publishes fine, and only fails on the
      # phone -- where the only way in is to uninstall first, destroying the
      # download history. Signing is invisible from the outside, so it is
      # checked before anything is published.
      - name: Check the APK is signed by the expected key
        run: |
          python3 verify-signing.py \
            app/build/outputs/apk/debug/app-debug.apk \
            grabber-debug.keystore android

      - name: Report the APK size
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Grabber-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions artifacts are zipped and need a signed-in browser. A release
      # asset on a public repository is a plain direct download, so the phone
      # can fetch the APK itself from a fixed address.
      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Grabber.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Grabber.apk \
            --title "Grabber v${{ github.run_number }}" \
            --notes "Build v${{ github.run_number }} from ${{ github.sha }}.

          Install straight from the phone: tap Grabber.apk below, then allow
          installing from this source when Android asks.

          Signed with the same key as every previous build, so it installs as
          an upgrade and keeps your download history."
