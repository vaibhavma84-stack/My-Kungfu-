/* =====================================================================
   The calculator
   Projection and step-up in one engine, run month by month rather than
   solved in closed form. A step-up SIP has no closed form worth trusting —
   the instalment changes every twelve months — and the same loop then serves
   the flat case, the lump sum, the RD and the FD without a second formula to
   keep in step with this one.

       monthly growth factor  g = (1 + r/(100 n))^(n/12)

   n is how many times a year the instrument compounds: 4 for a bank deposit,
   12 for a fund valued monthly. Writing it this way means the FD in the
   calculator and the FD in the portfolio are the same arithmetic.
   ===================================================================== */
const CALC0 = { kind:'sip', monthly:10000, lump:0, rate:12, years:10, step:10,
                target:0, solve:'value', comp:12, face:1000, coupon:7.5, view:'year' };

function calcRun(c){
  const n     = toNum(c.comp) || 12;
  const g     = Math.pow(1 + toNum(c.rate)/(100*n), n/12);   // one month's growth
  const N     = Math.max(1, Math.round(toNum(c.years) * 12));
  const step  = toNum(c.step) / 100;
  const base  = toNum(c.monthly);
  const rows  = [];
  let bal = toNum(c.lump), paid = toNum(c.lump), inst = base;

  for(let k = 1; k <= N; k++){
    // The instalment steps up on each anniversary, not each January.
    inst = base * Math.pow(1 + step, Math.floor((k-1)/12));
    if(c.kind !== 'lump'){ bal += inst; paid += inst; }
    bal *= g;
    rows.push({ k, month:k, inst: c.kind === 'lump' ? 0 : inst,
                paid, value:bal, gain:bal - paid });
  }
  // The run as a cash flow: what went in each month, and what it is worth at
  // the end. Its IRR is the return actually earned on money that went in a
  // bit at a time — for a flat rate it comes back as that rate, compounded,
  // which is the check that it is right.
  // An instalment is paid at the START of its month and is grown by that
  // month's factor, so month k's payment sits at time k-1 in the flow, not at
  // time k. Placing it a month late reads the return about a quarter of a
  // point high, which is exactly the sort of error nobody would ever spot.
  const flows = new Array(rows.length + 1).fill(0);
  flows[0] -= toNum(c.lump);
  rows.forEach((r,ix) => { flows[ix] -= r.inst; });
  flows[rows.length] += bal;
  const im = irr(flows);
  return { rows, N, g, paid, value:bal, gain:bal - paid,
           instFirst: base, instLast: inst, flows,
           irrMonthly: im,
           annual: im === null ? null : (Math.pow(1+im, 12) - 1) * 100 };
}
/* The return on money that went in a bit at a time.

   Dividing the final pot by everything ever paid in and taking a root gives a
   figure that is always too low: it treats the last instalment as though it
   had been sitting there since the first day. The honest answer is the rate
   that makes the whole run of payments and the final value balance —

       0 = SUM over k of  flow(k) / (1+i)^k        k in months

   — solved by bisection, because there is no closed form and a bisection over
   a run of one-signed payments followed by one positive value cannot land on
   a second root. It is returned as a monthly rate; the caller compounds it
   over whatever period it is quoting. */
function irr(flows){
  const npv = i => flows.reduce((s,f,k) => s + f/Math.pow(1+i, k), 0);
  if(!flows.some(f => f > 0) || !flows.some(f => f < 0)) return null;
  let lo = -0.9999, hi = 10;
  if(npv(lo) < 0 || npv(hi) > 0) return null;
  for(let n = 0; n < 200; n++){
    const mid = (lo+hi)/2;
    if(npv(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}
/* FV is proportional to the instalment once the step-up and the rate are
   fixed, so the amount needed for a target is one division, not a search. */
function calcSolveMonthly(c){
  const unit = calcRun(Object.assign({}, c, { monthly:1, lump:0 }));
  const fromLump = calcRun(Object.assign({}, c, { monthly:0 })).value;
  const need = toNum(c.target) - fromLump;
  return unit.value > 0 ? Math.max(0, need) / unit.value : 0;
}
function calcSolveLump(c){
  const g = Math.pow(1 + toNum(c.rate)/(100*(toNum(c.comp)||12)), (toNum(c.comp)||12)/12);
  const N = Math.max(1, Math.round(toNum(c.years)*12));
  const fromMonthly = calcRun(Object.assign({}, c, { lump:0 })).value;
  return Math.max(0, (toNum(c.target) - fromMonthly)) / Math.pow(g, N);
}
/* Group the months into periods and state the return earned in each one, on
   its own opening value — which is the honest per-period figure once money is
   still going in. A percentage on a pot that grew because more was paid into
   it is not a return, and is not shown as one. */
function calcPeriods(run, every){
  const out = [];
  for(let s = 0; s < run.rows.length; s += every){
    const slice = run.rows.slice(s, s + every);
    if(!slice.length) break;
    const last = slice[slice.length-1];
    const openValue = s === 0 ? 0 : run.rows[s-1].value;
    const openPaid  = s === 0 ? 0 : run.rows[s-1].paid;
    const inFlow = last.paid - openPaid;
    const growth = last.value - openValue - inFlow;
    // The period's own cash flow: the pot it opened with, the instalments paid
    // during it, and what it closed at. Dividing the growth by the opening
    // value instead would credit the period with returns earned on money that
    // only arrived half way through it, and read high in the early periods
    // exactly where the opening value is smallest.
    const flows = new Array(slice.length + 1).fill(0);
    flows[0] -= openValue;
    slice.forEach((r,ix) => { flows[ix] -= r.inst; });
    flows[slice.length] += last.value;
    const im = irr(flows);
    out.push({ label: every === 3 ? 'Q' + (out.length+1) : 'Year ' + (out.length+1),
               months: slice.length, paid:last.paid, value:last.value,
               gain:last.gain, inFlow, growth,
               ret: im === null ? null : (Math.pow(1+im, slice.length) - 1) * 100 });
  }
  return out;
}

function calculatorHtml(){

  const kindName = { sip:'Mutual fund SIP', rd:'Recurring deposit',

  const run = calcRun(c);
  const every = c.view === 'q' ? 3 : 12;
  const periods = calcPeriods(run, every);

  let h = '<div class="card" id="calc"><h2>Projection &amp; step-up calculator</h2>' +
    '<div class="seg" style="margin-bottom:10px">' +
    ['sip','rd','fd','lump','bond'].map(k => '<button data-calc-kind="' + k +
      '" aria-pressed="' + (c.kind===k) + '">' +
      esc(k === 'sip' ? 'SIP' : k === 'rd' ? 'RD' : k === 'fd' ? 'FD' :
          k === 'lump' ? 'Lump' : 'Bond') + '</button>').join('') + '</div>';

  h += '<div class="f2">';
  if(c.kind !== 'lump' && c.kind !== 'bond'){
    h += '<div class="f"><label>Each month</label><input type="number" ' +
      'inputmode="decimal" data-calc="monthly" value="' + esc(c.monthly) + '"></div>' +
      '<div class="f"><label>Step up % a year</label><input type="number" ' +
      'inputmode="decimal" step="0.5" data-calc="step" value="' + esc(c.step) + '"></div>';
  }
  h += '<div class="f"><label>' + (c.kind === 'lump' || c.kind === 'bond'
        ? 'Amount' : 'Lump sum to start') + '</label><input type="number" ' +
      'inputmode="decimal" data-calc="lump" value="' + esc(c.lump) + '"></div>' +
    '<div class="f"><label>Return % a year</label><input type="number" ' +
      'inputmode="decimal" step="0.1" data-calc="rate" value="' + esc(c.rate) + '"></div>' +
    '<div class="f"><label>For how many years</label><input type="number" ' +
      'inputmode="decimal" step="0.5" data-calc="years" value="' + esc(c.years) + '"></div>' +
    '<div class="f"><label>Compounded</label><select data-calc="comp">' +
      opts([{v:'12',t:'Monthly'},{v:'4',t:'Quarterly'},{v:'2',t:'Half-yearly'},
            {v:'1',t:'Yearly'}], String(c.comp)) + '</select></div></div>';

  h += '<div class="f"><label>Work out</label><select data-calc="solve">' +
    opts([{v:'value',t:'What it grows to'},
          {v:'monthly',t:'What I must put in each month'},
          {v:'lump',t:'What lump sum I must start with'}], c.solve) + '</select></div>';
  if(c.solve !== 'value'){
    h += '<div class="f"><label>Target amount</label><input type="number" ' +
      'inputmode="decimal" data-calc="target" value="' + esc(c.target) + '"></div>';
  }

  /* The answer */
  if(c.solve === 'monthly'){
    const need = calcSolveMonthly(c);
    const proof = calcRun(Object.assign({}, c, { monthly:need }));
    h += '<div class="right" style="margin-top:12px"><div class="muted small">' +
      'Starting instalment</div><div class="big">' + esc(money(need)) + '</div>' +
      '<div class="work">stepping up ' + num(toNum(c.step),1) + '% a year to ' +
      esc(money(proof.instLast)) + ' by the end · ' + esc(money(proof.paid)) +
      ' paid in · reaches ' + esc(money(proof.value)) + '</div></div>';
  }else if(c.solve === 'lump'){
    const need = calcSolveLump(c);
    h += '<div class="right" style="margin-top:12px"><div class="muted small">' +
      'Lump sum needed today</div><div class="big">' + esc(money(need)) + '</div>' +
      '<div class="work">at ' + num(toNum(c.rate),2) + '% for ' + num(toNum(c.years),1) +
      ' years' + (toNum(c.monthly) ? ', alongside ' + esc(money(toNum(c.monthly))) +
      ' a month' : '') + '</div></div>';
  }else{
    h += '<div class="right" style="margin-top:12px"><div class="muted small">' +
      'Worth at the end</div><div class="big">' + esc(money(run.value)) + '</div>' +
      '<div class="work ' + (run.gain<0?'neg':'pos') + '">' + esc(money(run.paid)) +
      ' put in · ' + esc(money(run.gain)) + ' earned' +
      (run.annual === null ? '' : ' · ' + num(run.annual,2) +
       '% a year on the money, counting when each instalment went in') + '</div>' +
      (c.kind !== 'lump' && c.kind !== 'bond' && toNum(c.step) ?
        '<div class="work">Instalment ' + esc(money(run.instFirst)) + ' rising to ' +
        esc(money(run.instLast)) + ' in the final year</div>' : '') + '</div>';
  }

  if(c.kind === 'bond'){
    const per = toNum(c.lump) * toNum(c.coupon) / 100;
    h += '<div class="f2" style="margin-top:10px">' +
      '<div class="f"><label>Coupon % a year</label><input type="number" ' +
      'inputmode="decimal" step="0.01" data-calc="coupon" value="' + esc(c.coupon) +
      '"></div><div class="f"><label>&nbsp;</label><div class="num" ' +
      'style="padding:9px 0">' + esc(money(per)) + ' a year</div></div></div>' +
      '<div class="work">Coupon is paid on face value and does not compound ' +
      'unless you reinvest it; the figure above assumes you do, at the return ' +
      'rate entered.</div>';
  }

  /* Every three months and every year, side by side with the choice. */
  h += '<div class="seg" style="margin:14px 0 8px">' +
    '<button data-calc="view" data-v="q"    aria-pressed="' + (c.view==='q') +
      '">Every 3 months</button>' +
    '<button data-calc="view" data-v="year" aria-pressed="' + (c.view==='year') +
      '">Every year</button></div>';
  h += '<div class="scroll"><table class="sched"><thead><tr>' +
    '<th>' + (every === 3 ? 'Quarter' : 'Year') + '</th><th>Put in</th>' +
    '<th>Earned</th><th>Return</th><th>Worth</th></tr></thead><tbody>' +
    periods.map(p => '<tr><td>' + esc(p.label) + '</td><td class="num">' +
      esc(money(p.inFlow)) + '</td><td class="num pos">' + esc(money(p.growth)) +
      '</td><td class="num">' + (p.ret === null ? '—' : num(p.ret,2) + '%') +
      '</td><td class="num">' + esc(money(p.value)) + '</td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="work">Return is the rate the period actually earned, worked ' +
    'out from the pot it opened with, the instalments paid during it and what ' +
    'it closed at — so an instalment paid in the last month is not credited ' +
    'with a full period&rsquo;s growth. "Put in" is money added, not return.</div>';

  h += '<div class="row wrap" style="margin-top:10px;gap:6px">' +
    '<button class="btn sm" data-calc-add="1">Add this to the portfolio</button>' +
    '</div>';
  h += '<div class="work">Nothing here is a forecast. It is what the rate you ' +
    'typed produces, arithmetically. A fund does not return the same percentage ' +
    'every year, and this does not pretend it does.</div></div>';
  return h;
}

/* =====================================================================
   Data — the backup, and the settings
   Export is the backup, not a convenience. Clearing the browser's website
   data erases every one of these lists, and iOS evicts storage for a page
   left unopened for long enough. Hence the banner that nags after 14 days.
   ===================================================================== */
function lastBackup(){ return localStorage.getItem(K.backup + 'all') || ''; }
function backupDays(){
  const b = lastBackup();
  if(!b) return null;
  const d = dateFromIso(b);
  return d ? Math.floor((new Date() - d) / 86400000) : null;
}
function renderBanner(){
  const days = backupDays();
  const rows = DB.income.length + DB.loans.length + DB.spend.length +
               DB.invest.length + DB.goals.length + DB.fixed.length;
  const snooze = localStorage.getItem(K.snooze) || '';
  let h = '';
  if(rows && snooze !== today()){
    if(days === null){
      h = '<div class="banner">Nothing has been backed up yet. This data lives ' +
        'on this phone only — <button class="btn sm" data-go="data">export it</button>.</div>';
    }else if(days >= 14){
      h = '<div class="banner' + (days >= 30 ? ' bad' : '') + '">Last backup was ' +
        days + ' days ago. <button class="btn sm" data-go="data">Export now</button> ' +
        '<button class="btn sec sm" data-snooze="1">Not today</button></div>';
    }
  }
  el('backup').innerHTML = h;
}
/* navigator.standalone is iOS-only and true only in a home-screen app. It is
   the one case where saving a file needs a different route entirely. */
function isIosStandalone(){ return navigator.standalone === true; }

/* The date is stamped only where the file is known to have gone somewhere.

   This used to be stamped unconditionally, at the moment of the click. On an
   iPhone home-screen app the click saves nothing — see below — so the app
   would record a backup that had not happened, go quiet for another fourteen
   days, and the first anyone would know is when the phone was wiped. A backup
   reminder that lies is worse than no reminder. */
function stampBackup(){
  localStorage.setItem(K.backup + 'all', today());
  renderBanner();
}

async function download(name, text, mime){
  const type = (mime || 'text/csv') + ';charset=utf-8';

  /* An iPhone home-screen app ignores a click on <a download> completely: no
     file, no error, nothing at all — the same silence as an Android WebView,
     for a different reason and with no shell here to catch it. The share
     sheet is the way out, and it saves to Files or sends the backup on.

     Safari in an ordinary tab is fine, and so is everything else, so this is
     kept to the one case that needs it rather than changing how the file is
     saved everywhere. */
  if(isIosStandalone()){
    try{
      const file = new File([text], name, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title:name });
        stampBackup();
        return true;
      }
    }catch(e){
      // Cancelling the share sheet is a decision, not a failure, and must not
      // be recorded as a backup.
      if(e && e.name === 'AbortError') return false;
    }
    alert('This iPhone cannot save a file from the home-screen app.\n\n' +
          'Open the same page in Safari and export from there — the data is ' +
          'the same, it is the saving that Safari can do and this cannot.');
    return false;
  }

  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  stampBackup();
  return true;
}
function csv(rows){
  // Quote everything. A note with a comma in it broke this in the deck log.
  return rows.map(r => r.map(c => {
    const s = c === null || c === undefined ? '' : String(c);
    return '"' + s.replace(/"/g,'""') + '"';
  }).join(',')).join('\r\n') + '\r\n';
}
function exportCsv(){
  const out = [['list','id','name','field1','field2','field3','field4','field5','note']];
  for(const i of DB.income)
    out.push(['income', i.id, i.name, i.amount, i.freq, i.start, i.end||'', '', i.note||'']);
  for(const l of DB.loans)
    out.push(['loan', l.id, l.name, l.principal, l.rate, l.months, l.emi, l.start, l.note||'']);
  for(const l of DB.loans) for(const x of (l.extras||[]))
    out.push(['prepay', l.id, l.name, x.amount, x.date, '', '', '', x.note||'']);
  for(const f of DB.fixed)
    out.push(['fixed', f.id, f.name, f.amount, f.freq, f.start, f.end||'', f.cat||'', f.note||'']);
  for(const s of DB.spend)
    out.push(['spend', s.id, s.cat||'Other', s.amount, s.date, '', '', '', s.note||'']);
  for(const h of DB.invest)
    out.push(['invest:' + h.kind, h.id, h.name, h.units||h.principal||h.monthly||'',
              h.buy||h.rate||'', h.price||h.months||'', h.start||h.asof||'',
              h.face||h.comp||'', h.note||'']);
  for(const g of DB.goals)
    out.push(['goal', g.id, g.name, g.target, g.by||'', goalSaved(g), '', '', g.note||'']);
  for(const g of DB.goals) for(const x of (g.ledger||[]))
    out.push(['goalpay', g.id, g.name, x.amount, x.date, '', '', '', '']);
  for(const r of DB.receipt)
    out.push(['receipt', r.incomeId||'', '', r.amount, r.date, '', '', '', r.note||'']);
  download('ledger-' + today() + '.csv', csv(out));
}
function exportJson(){
  // version 3 carries edit stamps and tombstones, which is what makes the
  // file mergeable rather than only restorable. Older files still import:
  // their records are stamped from their own ids on the way in.
  download('ledger-' + today() + '-' + deviceId() + '.json',
    JSON.stringify({ app:'ledger', version:3, saved:today(),
                     savedAt:Date.now(), settings:S, data:DB }, null, 1),
    'application/json');
}
/* An incoming file may predate edit stamps. Give its records the same stamps
   this phone would derive for them, so the merge has something to compare. */
function readyForMerge(obj){
  for(const name of LISTS){
    const list = Array.isArray(obj.data[name]) ? obj.data[name] : [];
    for(const r of list){
      if(!r || typeof r !== 'object') continue;
      if(!r.upd) r.upd = bornAt(r.id);
      for(const key of nestedKeys(name)){
        if(!Array.isArray(r[key])) continue;
        r[key].forEach((e, ix) => {
          if(e && typeof e === 'object'){
            if(!e.id)  e.id  = contentId(e, ix);
            if(!e.upd) e.upd = r.upd || 0;
          }
        });
      }
    }
    obj.data[name] = list;
  }
  if(!Array.isArray(obj.data.tomb)) obj.data.tomb = [];
  return obj;
}
function mergeReport(rep){
  const bits = [];
  if(rep.added)   bits.push(rep.added + ' new');
  if(rep.updated) bits.push(rep.updated + ' updated from the other phone');
  if(rep.kept)    bits.push(rep.kept + ' already newer here');
  if(rep.removed) bits.push(rep.removed + ' deleted');
  let out = bits.length ? bits.join(', ') + '.' : 'Nothing to bring across.';
  if(rep.revived){
    out += '\n\n' + rep.revived + ' record(s) had been deleted on one phone ' +
           'and edited on the other. The edit was kept — delete it again here ' +
           'if you meant it to go.';
  }
  if(rep.clashes.length){
    out += '\n\nEdited on both phones since the last sync — the newer edit ' +
           'was kept:\n• ' + rep.clashes.slice(0, 8).join('\n• ') +
           (rep.clashes.length > 8 ? '\n• …and ' + (rep.clashes.length-8) + ' more' : '');
  }
  return out;
}
function importJson(file, mode){
  const fr = new FileReader();
  fr.onload = () => {
    let obj;
    try{ obj = JSON.parse(fr.result); }
    catch(e){ alert('That file is not a Ledger file — it would not parse.'); return; }
    if(!obj || obj.app !== 'ledger' || !obj.data){
      alert('That file is not a Ledger file.'); return;
    }
    readyForMerge(obj);

    if(mode === 'merge'){
      const from = (obj.settings && obj.settings.dev) || 'the other phone';
      if(from === deviceId() &&
         !confirm('That file came from this phone, not the other one.\n\n' +
                  'Merging it will not do any harm, but it will not bring ' +
                  'anything across either. Go on?')) return;
      const rep = mergeSync(obj);
      render();
      alert('Merged.\n\n' + mergeReport(rep));
      return;
    }

    const counts = LISTS.map(k => k + ' ' + (obj.data[k] || []).length).join(', ');
    if(!confirm('REPLACE everything on this phone with this file?\n\n' + counts +
                '\n\nSaved ' + (obj.saved || 'unknown date') + '.\n\n' +
                'Anything entered on this phone and not in the file is lost. ' +
                'To combine two phones, use Merge instead.')) return;
    for(const name of LISTS){
      DB[name] = Array.isArray(obj.data[name]) ? obj.data[name] : [];
      save(name);
    }
    DB.tomb = Array.isArray(obj.data.tomb) ? obj.data.tomb : [];
    save('tomb');
    if(obj.settings){
      // Not the device id: that names this phone, and two phones sharing one
      // would make every tie between them break the wrong way for ever.
      const keepDev = S.dev, keepHlc = S.hlc;
      Object.assign(S, obj.settings);
      S.dev = keepDev;
      // Absorb their clock rather than adopting it: going backwards here
      // would let this phone re-issue stamps it has already used.
      S.hlc = keepHlc;
      if(obj.settings.hlc) hlcSee(obj.settings.hlc.ms, obj.settings.hlc.c);
      save('set');
    }
    document.documentElement.setAttribute('data-theme', S.theme === 'dark' ? 'dark' : 'light');
    render();
    alert('Restored.');
  };
  fr.readAsText(file);
}

/* =====================================================================
   Events — one listener on the document, records addressed by data-
   ===================================================================== */
function render(){
  renderBanner();
  el('netTop').textContent = money(netWorth().net);
  if(TAB === 'month')  renderMonth();
  if(TAB === 'income') renderIncome();
  if(TAB === 'loans')  renderLoans();
  if(TAB === 'spend')  renderSpend();
  if(TAB === 'invest') renderInvest();
  if(TAB === 'goals')  renderGoals();
  if(TAB === 'data')   renderData();
}
function upsert(name, rec){
  stamp(rec);
  if(name === 'invest') notePrice(rec);
  const i = DB[name].findIndex(x => x.id === rec.id);
  if(i >= 0) DB[name][i] = rec; else DB[name].push(rec);
  if(save(name)){
    if(name === 'invest') noteSnapshot();
    render();
  }
}
function removeRec(name, id){
  DB[name] = DB[name].filter(x => x.id !== id);
  // Without the tombstone the record walks straight back in from the other
  // phone at the next merge, and deleting anything becomes impossible.
  tombstone(id);
  if(save(name)) render();
}
function editRecord(name, fields, id, title){
  const isNew = !id;
  const rec = isNew ? { id:uid() } : DB[name].find(x => x.id === id);
  if(!rec) return;
  editor((isNew ? 'New ' : '') + title, fields, Object.assign({}, rec),
    r => upsert(name, r),
    isNew ? null : () => { if(confirm('Delete this?')) removeRec(name, id); });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go],[data-go-month],[data-pie],' +
    '[data-add],[data-edit],[data-openloan],[data-prepay],[data-delextra],' +
    '[data-ratechg],[data-delrate],[data-qcat],[data-undoadd],' +
    '[data-invkind],[data-putgoal],[data-export],[data-wipe],[data-snooze],' +
    '[data-prices],' +
    '[data-savesettings],[data-calc-kind],[data-calc-add],[data-calc="view"]');
  if(!t) return;
  const d = t.dataset;

  if(d.tab)      { show(d.tab); return; }
  if(d.go)       { show(d.go); return; }
  if(d.goMonth)  { S.month = d.goMonth; save('set'); render(); return; }
  if(d.pie)      { PIE_VIEW = d.pie; renderMonth(); return; }
  if(d.invkind)  { INV_KIND = d.invkind; renderInvest(); return; }
  if(d.openloan) { OPEN_LOAN = (OPEN_LOAN === d.openloan) ? null : d.openloan;
                   renderLoans(); return; }
  if(d.snooze)   { localStorage.setItem(K.snooze, today()); renderBanner(); return; }
  if(d.prices)   { pricesEditor(); return; }

  if(d.qcat){
    const box = el('qAmt');
    const amt = box ? toNum(box.value) : 0;
    if(!(amt > 0)){
      if(box){ box.focus(); box.select(); }
      return;
    }
    const rec = { id:uid(), date:today(), amount:amt, cat:d.qcat, note:'' };
    LAST_ADD = rec;
    S.month = thisMonth();          // file it where it will be seen
    upsert('spend', rec);
    const again = el('qAmt');
    if(again){ again.value = ''; again.focus(); }
    return;
  }
  if(d.undoadd){
    if(LAST_ADD){
      removeRec('spend', LAST_ADD.id);
      LAST_ADD = null;
      renderSpend();
    }
    return;
  }

  if(d.add){
    if(d.add === 'income') return editRecord('income', INCOME_FIELDS, null, 'income source');
    if(d.add === 'loan')   return editRecord('loans', LOAN_FIELDS, null, 'loan');
    if(d.add === 'fixed')  return editRecord('fixed', FIXED_FIELDS, null, 'fixed outgoing');
    if(d.add === 'spend'){
      return editor('New expense', spendFields(),
        { id:uid(), date:today(), cat:S.spendCats[0] },
        r => upsert('spend', r), null);
    }
    if(d.add === 'goal')   return editRecord('goals', GOAL_FIELDS, null, 'goal');
    if(d.add === 'receipt'){
      const src = DB.income.map(i => ({v:i.id, t:i.name || 'Untitled'}));
      return editor('Record a receipt', [
        { k:'date',     label:'Date',   type:'date', half:true },
        { k:'amount',   label:'Amount', type:'money', half:true },
        { k:'incomeId', label:'Against', type:'select',
          options:[{v:'',t:'— not one of the listed sources —'}].concat(src) },
        { k:'note',     label:'Note' }
      ], { id:uid(), date:today() }, r => upsert('receipt', r), null);
    }
    if(d.add.startsWith('inv:')){
      const kind = d.add.slice(4);
      return editor('New ' + KINDS[kind].toLowerCase(), investFields(kind),
        { id:uid(), kind, start:today(), asof:today(),
          comp: (kind === 'fd' || kind === 'rd') ? '4' : undefined },
        r => upsert('invest', r), null);
    }
  }

  if(d.edit){
    const id = d.id;
    if(d.edit === 'income') return editRecord('income', INCOME_FIELDS, id, 'income source');
    if(d.edit === 'loan')   return editRecord('loans', LOAN_FIELDS, id, 'loan');
    if(d.edit === 'fixed')  return editRecord('fixed', FIXED_FIELDS, id, 'fixed outgoing');
    if(d.edit === 'spend')  return editRecord('spend', spendFields(), id, 'expense');
    if(d.edit === 'goal')   return editRecord('goals', GOAL_FIELDS, id, 'goal');
    if(d.edit === 'receipt'){
      const src = DB.income.map(i => ({v:i.id, t:i.name || 'Untitled'}));
      return editRecord('receipt', [
        { k:'date',     label:'Date',   type:'date', half:true },
        { k:'amount',   label:'Amount', type:'money', half:true },
        { k:'incomeId', label:'Against', type:'select',
          options:[{v:'',t:'— not one of the listed sources —'}].concat(src) },
        { k:'note',     label:'Note' }
      ], id, 'receipt');
    }
    if(d.edit === 'inv'){
      const h = DB.invest.find(x => x.id === id);
      if(!h) return;
      return editRecord('invest', investFields(h.kind), id, KINDS[h.kind].toLowerCase());
    }
  }

  if(d.prepay){
    const loan = DB.loans.find(l => l.id === d.prepay);
    if(!loan) return;
    return editor('Prepayment towards ' + (loan.name||'loan'), [
      { k:'date',   label:'Date',   type:'date', half:true },
      { k:'amount', label:'Amount', type:'money', half:true },
      { k:'note',   label:'Note' },
      { k:'n', type:'note', label:'A prepayment comes off the balance in the ' +
        'month it is made, and the rest of the schedule is worked out again ' +
        'from there — which is the whole reason this screen exists.' }
    ], { date:today() }, r => {
      loan.extras = (loan.extras || []).concat([Object.assign({ id:uid() },
        newStamp(), { date:r.date, amount:toNum(r.amount), note:r.note||'' })]);
      upsert('loans', loan);
    }, null);
  }
  if(d.ratechg){
    const loan = DB.loans.find(l => l.id === d.ratechg);
    if(!loan) return;
    return editor('Rate change on ' + (loan.name||'loan'), [
      { k:'from', label:'In force from', type:'date', half:true },
      { k:'rate', label:'New rate % a year', type:'number', half:true, step:'0.01' },
      { k:'note', label:'Note', ph:'Repo cut, reset letter…' },
      { k:'n', type:'note', label:'The instalment is left as it is, so the loan ' +
        'takes longer or shorter to clear — which is what the bank does unless ' +
        'you ask it to re-fix the EMI instead. If you did agree a new EMI, edit ' +
        'the loan and change it there too.' }
    ], { from:today(), rate:rateAt(loan, thisMonth()) }, r => {
      loan.rates = (loan.rates || []).concat([Object.assign({ id:uid() },
        newStamp(), { from:r.from, rate:toNum(r.rate), note:r.note||'' })]);
      upsert('loans', loan);
    }, null);
  }
  if(d.delrate){
    const [id, rid] = d.delrate.split(':');
    const loan = DB.loans.find(l => l.id === id);
    if(loan && confirm('Remove this rate change?')){
      loan.rates = (loan.rates || []).filter(x => x.id !== rid);
      tombstone(rid);
      upsert('loans', loan);
    }
    return;
  }
  if(d.delextra){
    const [id, eid] = d.delextra.split(':');
    const loan = DB.loans.find(l => l.id === id);
    if(loan && confirm('Remove this prepayment?')){
      loan.extras = (loan.extras || []).filter(x => x.id !== eid);
      tombstone(eid);          // or it returns at the next merge
      upsert('loans', loan);
    }
    return;
  }
  if(d.putgoal){
    const g = DB.goals.find(x => x.id === d.putgoal);
    if(!g) return;
    return editor('Into ' + (g.name||'goal'), [
      { k:'date',   label:'Date',   type:'date', half:true },
      { k:'amount', label:'Amount', type:'money', half:true }
    ], { date:today() }, r => {
      g.ledger = (g.ledger || []).concat([Object.assign({ id:uid() },
        newStamp(), { date:r.date, amount:toNum(r.amount) })]);
      upsert('goals', g);
    }, null);
  }

  if(d.calcKind){
    S.calc = Object.assign({}, CALC0, S.calc || {}, { kind:d.calcKind,
      comp: (d.calcKind === 'fd' || d.calcKind === 'rd') ? 4 : 12 });
    save('set'); renderInvest();
    el('calc').scrollIntoView({block:'start'});
    return;
  }
  if(t.dataset.calc === 'view'){
    S.calc = Object.assign({}, CALC0, S.calc || {}, { view:t.dataset.v });
    save('set'); renderInvest();
    el('calc').scrollIntoView({block:'start'});
    return;
  }
  if(d.calcAdd){
    const c = Object.assign({}, CALC0, S.calc || {});
    const months = Math.round(toNum(c.years) * 12);
    const kind = c.kind === 'sip' ? 'mf' : c.kind === 'lump' ? 'mf' : c.kind;
    const rec = { id:uid(), kind, start:today(), note:'From the calculator: ' +
      num(toNum(c.rate),2) + '% for ' + num(toNum(c.years),1) + ' years' +
      (toNum(c.step) ? ', stepping up ' + num(toNum(c.step),1) + '% a year' : '') };
    if(kind === 'rd'){ rec.monthly = toNum(c.monthly); rec.rate = toNum(c.rate);
                       rec.months = months; rec.comp = String(c.comp); }
    else if(kind === 'fd'){ rec.principal = toNum(c.lump); rec.rate = toNum(c.rate);
                       rec.months = months; rec.comp = String(c.comp);
                       rec.payout = 'cumulative'; }
    else if(kind === 'bond'){ rec.units = 1; rec.face = toNum(c.lump);
                       rec.buy = toNum(c.lump); rec.coupon = toNum(c.coupon); }
    else { rec.sip = toNum(c.monthly); rec.units = 0; rec.buy = 0; rec.price = 0;
           rec.asof = today(); }
    return editor('Add to the portfolio', investFields(kind), rec,
      r => { upsert('invest', r); INV_KIND = 'all'; }, null);
  }

  if(d.export){ d.export === 'json' ? exportJson() : exportCsv(); return; }
  if(d.savesettings){
    document.querySelectorAll('[data-set]').forEach(n => {
      if(n.dataset.set === 'spendCatsText'){
        S.spendCats = n.value.split(',').map(s => s.trim()).filter(Boolean);
        if(!S.spendCats.length) S.spendCats = DEFAULT_CATS.slice();
      } else S[n.dataset.set] = n.value;
    });
    document.documentElement.setAttribute('data-theme', S.theme === 'dark' ? 'dark' : 'light');
    if(save('set')) render();
    return;
  }
  if(d.wipe){
    if(!confirm('Erase every record on this phone?')) return;
    if(!confirm('Really? There is no undo, and no copy anywhere else.')) return;
    for(const name of ['income','receipt','loans','fixed','spend','invest','goals']){
      DB[name] = []; save(name);
    }
    render();
  }
});

/* The calculator recomputes as you type rather than on a button, because the
   question is nearly always "and what if it were 12 instead of 10". */
document.addEventListener('input', e => {
  if(e.target && e.target.id === 'qFind'){
    SPEND_Q = e.target.value;
    const pos = e.target.selectionStart;
    renderSpend();
    const again = el('qFind');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
    return;
  }
  const n = e.target.closest('[data-calc]');
  if(n && n.dataset.calc !== 'view'){
    const c = Object.assign({}, CALC0, S.calc || {});
    c[n.dataset.calc] = n.value === '' ? 0 : toNum(n.value);
    if(n.dataset.calc === 'solve') c.solve = n.value;
    S.calc = c; save('set');
    const active = document.activeElement, k = n.dataset.calc,
          pos = n.selectionStart;
    renderInvest();
    const again = document.querySelector('[data-calc="' + k + '"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
  }
});
document.addEventListener('change', e => {
  const n = e.target.closest('select[data-calc]');
  if(n){
    const c = Object.assign({}, CALC0, S.calc || {});
    c[n.dataset.calc] = n.dataset.calc === 'solve' ? n.value : toNum(n.value);
    S.calc = c; save('set'); renderInvest();
  }
});

/* ---------- dialog buttons ---------- */
el('dlgSave').onclick = () => {
  const rec = readFields();
  closeDialog();
  if(DLG && DLG.onSave) DLG.onSave(rec);
  DLG = null;
};
el('dlgCancel').onclick = el('dlgX').onclick = () => { closeDialog(); DLG = null; };
el('dlgDelete').onclick = () => {
  const fn = DLG && DLG.onDelete;
  closeDialog(); DLG = null;
  if(fn) fn();
};

/* ---------- boot ---------- */
load();
show('month');
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
  /* The deck log's worker sits one level up and its scope covers this folder.
     When it activates a new build it messages every page in that scope and,
     if a page does not answer, navigates it — which would reload this one,
     possibly over a half-typed expense. It cannot know this page exists, so
     this page answers for itself: acknowledged, and not reloaded.

     Its own updates are picked up on the next launch either way, which is how
     this app has always taken them. */
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data && e.data.type === 'sw-updated' && e.ports && e.ports[0]){
      try{ e.ports[0].postMessage({ ok:true, app:'ledger' }); }catch(err){}
    }
  });
}
</script>
