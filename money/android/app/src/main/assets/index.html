<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#123A2C">
<title>Ledger</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root{
    --hull:#123A2C;
    --hull-2:#1B4C3A;
    --steel:#3E6B57;
    --paper:#F6F4EF;
    --paper-2:#EDE9DF;
    --card:#FFFFFF;
    --ink:#1B2530;
    --ink-soft:#5B6673;
    --line:#D8D2C4;
    --in:#2E7D5B;
    --out:#C7452C;
    --warn:#D6963B;
    --info:#2B5FA0;
    --focus:#1E88C7;
    --tint-in:#E8F0E9;
    --tint-out:#FBF1EE;
    --tint-warn:#FFF7E8;
    --tint-info:#EAF1FB;
    --tint-line:rgba(0,0,0,.08);
  }
  :root[data-theme="dark"]{
    --paper:#10161B;
    --paper-2:#18212A;
    --card:#1A232C;
    --ink:#E4E9ED;
    --ink-soft:#96A3AF;
    --line:#2F3B47;
    --steel:#7FB39A;
    --in:#79C39D;
    --out:#E2705A;
    --warn:#E0A75E;
    --info:#7FA6C8;
    --focus:#5AB0E8;
    --tint-in:#16251D;
    --tint-out:#2C1D1A;
    --tint-warn:#2B2416;
    --tint-info:#16232F;
    --tint-line:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:16px;}
  .mono,.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;}

  /* ---------- chrome ---------- */
  header{position:sticky;top:0;z-index:40;background:var(--hull);color:#EAF2EE;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 0;}
  .hbar{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;}
  .hbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em;}
  .hbar .sub{font-size:12px;color:#9BBFAF;margin-left:auto;}
  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;
    color:#9BBFAF;font:inherit;font-size:14px;padding:9px 12px;cursor:pointer;}
  nav button[aria-selected="true"]{color:#FFF;border-bottom-color:#7FD3AC;font-weight:600;}
  main{padding:12px 12px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto;}
  section[hidden]{display:none;}

  /* ---------- pieces ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;margin:0 0 10px;}
  .card h2{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);font-weight:600;}
  .row{display:flex;gap:8px;align-items:center;}
  .row.wrap{flex-wrap:wrap;}
  .grow{flex:1 1 auto;min-width:0;}
  .muted{color:var(--ink-soft);}
  .small{font-size:12px;}
  .tiny{font-size:11px;}
  .right{text-align:right;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 3px;}
  input,select,textarea,button{font:inherit;color:var(--ink);}
  input,select,textarea{width:100%;background:var(--paper-2);border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;-webkit-appearance:none;appearance:none;}
  input:focus,select,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),
    linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
  input[type=checkbox]{width:auto;}
  .f{margin:0 0 8px;}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .btn{background:var(--hull);color:#fff;border:0;border-radius:8px;padding:10px 14px;
    cursor:pointer;font-size:15px;}
  .btn.sec{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:var(--out);color:#fff;}
  .btn.sm{padding:6px 10px;font-size:13px;}
  .btn:active{opacity:.75;}
  .chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
    border:1px solid var(--tint-line);background:var(--paper-2);color:var(--ink-soft);}
  .chip.in{background:var(--tint-in);color:var(--in);border-color:var(--tint-line);}
  .chip.out{background:var(--tint-out);color:var(--out);}
  .chip.warn{background:var(--tint-warn);color:var(--warn);}
  .chip.info{background:var(--tint-info);color:var(--info);}
  .item{border:1px solid var(--line);border-radius:10px;background:var(--card);
    padding:10px;margin:0 0 8px;}
  .item .top{display:flex;gap:8px;align-items:baseline;}
  .item .nm{font-weight:600;font-size:15px;}
  .item .amt{margin-left:auto;font-weight:600;white-space:nowrap;}
  .pos{color:var(--in);} .neg{color:var(--out);}
  .bar{height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin:7px 0 0;}
  .bar > i{display:block;height:100%;background:var(--in);}
  .bar.over > i{background:var(--out);}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px;}
  .kv .k{color:var(--ink-soft);}
  .kv.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;font-weight:600;}
  .big{font-size:26px;font-weight:600;letter-spacing:-.01em;}
  .work{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:18px 6px;}
  .banner{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13px;
    background:var(--tint-warn);border:1px solid var(--tint-line);}
  .banner.bad{background:var(--tint-out);}
  details > summary{cursor:pointer;font-size:13px;color:var(--ink-soft);
    list-style:none;padding:4px 0;}
  details > summary::-webkit-details-marker{display:none;}
  details > summary::before{content:"\25B8 ";}
  details[open] > summary::before{content:"\25BE ";}
  table.sched{width:100%;border-collapse:collapse;font-size:12px;}
  table.sched th,table.sched td{padding:4px 5px;border-bottom:1px solid var(--line);
    text-align:right;}
  table.sched th:first-child,table.sched td:first-child{text-align:left;}
  table.sched th{color:var(--ink-soft);font-weight:600;position:sticky;top:0;
    background:var(--card);}
  .scroll{max-height:300px;overflow:auto;-webkit-overflow-scrolling:touch;}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{flex:1 1 0;background:var(--paper-2);border:0;border-right:1px solid var(--line);
    padding:8px 4px;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .seg button:last-child{border-right:0;}
  .seg button[aria-pressed="true"]{background:var(--hull);color:#fff;font-weight:600;}
  dialog{border:0;border-radius:12px;padding:0;background:var(--card);color:var(--ink);
    width:min(560px,94vw);max-height:88vh;}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  dialog:not([open]){display:none;}
  /* Safari before 15.4 has no <dialog>: same markup, shown as a plain panel. */
  dialog.fallback{display:block;position:fixed;top:4vh;left:0;right:0;
    margin:0 auto;z-index:100;box-shadow:0 12px 44px rgba(0,0,0,.45);
    border:1px solid var(--line);}
  .dlg-hd{position:sticky;top:0;background:var(--hull);color:#fff;padding:11px 14px;
    display:flex;align-items:center;gap:8px;}
  .dlg-hd h3{margin:0;font-size:15px;font-weight:600;}
  .dlg-bd{padding:14px;overflow:auto;max-height:calc(88vh - 110px);}
  .dlg-ft{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;
    background:var(--card);}

  /* ---------- the pie ---------- */
  .pie-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .pie{width:180px;height:180px;flex:0 0 auto;}
  .pie .sl{transition:none;}
  .pie .plab{font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;
    dominant-baseline:middle;paint-order:stroke;stroke:rgba(0,0,0,.35);
    stroke-width:2px;stroke-linejoin:round;}
  .pie .pc1{font-size:16px;font-weight:600;text-anchor:middle;fill:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .pie .pc2{font-size:9px;text-anchor:middle;fill:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.06em;}
  .pie-list{flex:1 1 200px;min-width:190px;}
  .pie-list .kv .k{display:flex;align-items:center;gap:7px;}
  .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;display:inline-block;
    margin-right:4px;vertical-align:-1px;}
  .spark{display:block;margin:6px 0 0;overflow:visible;}
  .mbars{margin:2px 0 10px;}
  .mbar{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;}
  .mbar .ml{flex:0 0 46px;font-size:11px;color:var(--ink-soft);}
  .mbar .mt{flex:1 1 auto;height:9px;border-radius:99px;background:var(--paper-2);
    overflow:hidden;}
  .mbar .mt > i{display:block;height:100%;background:var(--steel);border-radius:99px;}
  .mbar .mv{flex:0 0 auto;font-size:11px;min-width:72px;text-align:right;}
  .mbar.on .mt > i{background:var(--hull);}
  :root[data-theme="dark"] .mbar.on .mt > i{background:var(--focus);}
  .mbar.on .ml,.mbar.on .mv{color:var(--ink);font-weight:600;}
  svg.line{width:100%;height:auto;display:block;margin:2px 0 0;overflow:visible;}
  svg.line .gl{stroke:var(--line);stroke-width:1;}
  svg.line .ll{font-size:9px;fill:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  svg.line .ll.dim{fill:var(--ink-soft);}
  svg.line .ax{font-size:9px;fill:var(--ink-soft);}
  @media (max-width:400px){ .pie-wrap{justify-content:center;} }
  .f.half{margin:0;}
  .f2 > .f{margin:0 0 8px;}
  sup{font-size:.75em;}
  .x{margin-left:auto;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;
    line-height:1;padding:0 4px;}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1>Ledger</h1>
    <span class="sub" id="netTop"></span>
  </div>
  <nav id="nav" role="tablist">
    <button role="tab" data-tab="month"  aria-selected="true">Month</button>
    <button role="tab" data-tab="income" aria-selected="false">Income</button>
    <button role="tab" data-tab="loans"  aria-selected="false">Loans</button>
    <button role="tab" data-tab="spend"  aria-selected="false">Spend</button>
    <button role="tab" data-tab="invest" aria-selected="false">Invest</button>
    <button role="tab" data-tab="goals"  aria-selected="false">Goals</button>
    <button role="tab" data-tab="data"   aria-selected="false">Data</button>
  </nav>
</header>
<main>
  <div id="backup"></div>
  <section id="tab-month"  role="tabpanel"></section>
  <section id="tab-income" role="tabpanel" hidden></section>
  <section id="tab-loans"  role="tabpanel" hidden></section>
  <section id="tab-spend"  role="tabpanel" hidden></section>
  <section id="tab-invest" role="tabpanel" hidden></section>
  <section id="tab-goals"  role="tabpanel" hidden></section>
  <section id="tab-data"   role="tabpanel" hidden></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <div class="dlg-hd"><h3 id="dlgTitle"></h3>
      <button type="button" class="x" id="dlgX" aria-label="Close">&times;</button></div>
    <div class="dlg-bd" id="dlgBody"></div>
    <div class="dlg-ft">
      <button type="button" class="btn" id="dlgSave">Save</button>
      <button type="button" class="btn sec" id="dlgCancel">Cancel</button>
      <button type="button" class="btn danger sm" id="dlgDelete" style="margin-left:auto">Delete</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
/* =====================================================================
   Ledger — one file, no libraries, no network.
   Everything is computed on the device from figures typed in by hand.
   There is no price feed and no bank link: at sea there is no signal, and a
   number that silently went stale is worse than one you entered yourself.
   ===================================================================== */

/* ---------- dates: local time, never toISOString ----------
   toISOString() converts to UTC first, so slicing it gives yesterday's date
   east of Greenwich in the morning. Every date in this app is built from
   local components. This is the same rule as the deck log, for the same
   reason, and it is easy to break again. */
function isoFromDate(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function today(){ return isoFromDate(new Date()); }
function dateFromIso(s){
  if(!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  if(!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
function ym(iso){ return (iso||'').slice(0,7); }              // '2026-09'
function thisMonth(){ return ym(today()); }
function monthAdd(m, n){                                       // '2026-09', 4
  const [y,mm] = m.split('-').map(Number);
  const t = (y*12 + (mm-1)) + n;
  return String(Math.floor(t/12)) + '-' + String(t%12 + 1).padStart(2,'0');
}
function monthDiff(a, b){                                      // b - a, in months
  const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number);
  return (by*12 + bm) - (ay*12 + am);
}
function monthName(m){
  const d = dateFromIso(m + '-01');
  return d ? d.toLocaleDateString(undefined,{month:'long',year:'numeric'}) : m;
}
function shortMonth(m){
  const d = dateFromIso(m + '-01');
  return d ? d.toLocaleDateString(undefined,{month:'short',year:'2-digit'}) : m;
}
function dayOfMonth(m, day){                                   // clamped to month end
  const [y,mm] = m.split('-').map(Number);
  const last = new Date(y, mm, 0).getDate();
  return m + '-' + String(Math.min(Math.max(day||1,1), last)).padStart(2,'0');
}
/* Months between two dates, with the part-month as a fraction of the month it
   falls in. Deposits are quoted in months, so elapsed time is counted in
   months too — measuring it in average-length years instead left "worth
   today" a few rupees short of "at maturity" on the maturity date itself. */
function monthsBetween(aIso, bIso){
  const a = dateFromIso(aIso), b = dateFromIso(bIso);
  if(!a || !b) return 0;
  const whole = monthDiff(ym(aIso), ym(bIso));
  const da = a.getDate(), db = b.getDate();
  const inB = new Date(b.getFullYear(), b.getMonth()+1, 0).getDate();
  return whole + (db - da) / inB;
}
function fmtDate(iso){
  const d = dateFromIso(iso);
  return d ? d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) : '';
}

/* ---------- money ----------
   Rupees are held as numbers and rounded only for display. Indian digit
   grouping (1,23,456) comes from Intl, which is in the engine — no library. */
/* The build this page is. CI reads it out of here to name the APK and its
   release, and the Data tab prints it, so "which version is actually on the
   phone" is a question that can be answered by looking rather than guessed. */
const APP_BUILD = 'v8';

const S = { cur:'₹', locale:'en-IN', theme:'light', month:'', spendCats:[] };
function money(n, dp){
  if(n === null || n === undefined || !isFinite(n)) return '—';
  const d = dp === undefined ? 0 : dp;
  let out;
  try{ out = Math.abs(n).toLocaleString(S.locale,
        {minimumFractionDigits:d, maximumFractionDigits:d}); }
  catch(e){ out = Math.abs(n).toFixed(d); }
  return (n < 0 ? '-' : '') + S.cur + out;
}
function num(n, dp){
  if(n === null || n === undefined || !isFinite(n)) return '—';
  const d = dp === undefined ? 2 : dp;
  try{ return n.toLocaleString(S.locale,{minimumFractionDigits:d,maximumFractionDigits:d}); }
  catch(e){ return n.toFixed(d); }
}
function pct(n){ return isFinite(n) ? (n>=0?'+':'') + n.toFixed(2) + '%' : '—'; }
function toNum(v){ const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; }

/* ---------- storage ----------
   localStorage is per ORIGIN, not per path. On GitHub Pages this app and the
   deck log sit under one origin and therefore share one store and one quota,
   so every key here is prefixed money_ and nothing here ever touches a
   gasplanet_ key.

   Writes are verified and rolled back. A quota failure used to be swallowed
   in the deck log: the change stayed in memory, the screen looked normal, and
   everything since the failure vanished on reload. */
const K = {
  income :'money_income_v1',
  receipt:'money_receipt_v1',
  loans  :'money_loans_v1',
  fixed  :'money_fixed_v1',
  spend  :'money_spend_v1',
  invest :'money_invest_v1',
  goals  :'money_goals_v1',
  snap   :'money_snap_v1',
  tomb   :'money_tomb_v1',
  set    :'money_settings_v1',
  backup :'money_lastBackup_',
  snooze :'money_backupSnooze'
};
const LISTS  = ['income','receipt','loans','fixed','spend','invest','goals','snap'];
/* The two places a record holds records of its own. They have to be merged in
   their own right: a prepayment added on one phone and one added on the other
   both have to survive, whichever copy of the loan happens to be newer. */
const NESTED = { loans:['extras','rates'], goals:['ledger'], invest:['hist'] };
function nestedKeys(name){ return NESTED[name] || []; }

let DB = { income:[], receipt:[], loans:[], fixed:[], spend:[], invest:[],
           goals:[], snap:[], tomb:[] };

function load(){
  for(const name of LISTS.concat(['tomb'])){
    try{
      const raw = localStorage.getItem(K[name]);
      const v = raw ? JSON.parse(raw) : [];
      DB[name] = Array.isArray(v) ? v : [];
    }catch(e){ DB[name] = []; }
  }
  try{
    const raw = localStorage.getItem(K.set);
    if(raw) Object.assign(S, JSON.parse(raw));
  }catch(e){}
  if(!S.month) S.month = thisMonth();
  if(!Array.isArray(S.spendCats) || !S.spendCats.length) S.spendCats = DEFAULT_CATS.slice();
  /* A ledger set up before the list grew keeps everything it had and gains the
     new ones once. Additive, like the merge between two phones: a category
     someone added is never a reason to lose one they had. Trimming the list
     afterwards sticks, because this only ever runs again if the version
     number moves. */
  if((S.catsV || 1) < 2){
    for(const c of DEFAULT_CATS) if(!S.spendCats.includes(c)) S.spendCats.push(c);
    S.catsV = 2;
  }
  migrateForSync();
  document.documentElement.setAttribute('data-theme', S.theme === 'dark' ? 'dark' : 'light');
}
function save(name){
  const key = K[name];
  const before = localStorage.getItem(key);
  const text = JSON.stringify(name === 'set' ? S : DB[name]);
  try{
    localStorage.setItem(key, text);
    if(localStorage.getItem(key) !== text) throw new Error('short write');
    return true;
  }catch(e){
    // Put the store back the way it was, then reload the copy in memory from
    // it, so what is on the screen is what actually reached the disk.
    try{ before === null ? localStorage.removeItem(key) : localStorage.setItem(key, before); }
    catch(e2){}
    if(name !== 'set'){
      try{ DB[name] = before ? JSON.parse(before) : []; }catch(e3){ DB[name] = []; }
    }
    alert('Could not save — the phone’s storage for this site is full.\n\n' +
          'Nothing was changed. Export a backup from the Data tab, then delete ' +
          'old entries to make room.');
    return false;
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* =====================================================================
   Two phones, one ledger
   Both phones hold the whole thing. A sync file is carried across by hand —
   AirDrop, or anything else — and merged in. There is no server and no
   account, which is the same reason everything else here works with no
   signal.

   The rule is per record, not per file: whichever phone touched a record
   last wins that record, and nothing else is disturbed. The old import
   replaced the lot, which for two people is not a sync at all — whoever
   imported second lost their own week.

   Three things make the merge safe to run in any order, any number of times:

     - every record carries when it was last edited, and on which phone
     - a delete leaves a tombstone behind, or the record simply walks back in
       from the other phone at the next merge
     - ties break on the device id, so both phones resolve them the same way
       and end up identical rather than each keeping its own answer
   ===================================================================== */
function deviceId(){
  if(!S.dev){ S.dev = 'd' + Math.random().toString(36).slice(2,8); save('set'); }
  return S.dev;
}
/* ---------- the clock ----------
   A hybrid logical clock, not the wall clock.

   Wall-clock last-write-wins has a failure that looks exactly like the app
   losing data. Say her phone is ten minutes slow. I edit a loan at 09:55 and
   send it over; she merges it, then edits the same loan at 10:05 — her phone
   stamps it 09:55 by its own reckoning, or earlier, and my older edit wins.
   Her change vanishes and nothing anywhere says why.

   The fix is to carry a counter beside the time and to advance it whenever a
   stamp is *seen*, not only when one is made. Having merged my 09:55, her
   phone will not issue anything below it again, so her later edit sorts after
   mine however wrong her clock is.

   What that guarantees precisely: an edit made after seeing another edit
   always wins. Two edits made without either phone having seen the other are
   genuinely concurrent, and no clock can order those — there the device id
   decides, and the point of that is only that both phones decide the same
   way. (Taken from the Swift version of this app, which got here first.) */
function hlcNow(){
  const phys = Date.now(), last = S.hlc || { ms:0, c:0 };
  S.hlc = phys > last.ms ? { ms:phys, c:0 } : { ms:last.ms, c:last.c + 1 };
  save('set');
  return S.hlc;
}
/* Absorb a stamp from somewhere else, so nothing issued here afterwards can
   sort below it. This is the half that makes the counter worth having. */
function hlcSee(ms, c){
  const phys = Date.now(), last = S.hlc || { ms:0, c:0 };
  const rm = ms || 0, rc = c || 0;
  if(phys > last.ms && phys > rm)   S.hlc = { ms:phys, c:0 };
  else if(last.ms === rm)           S.hlc = { ms:last.ms, c:Math.max(last.c, rc) + 1 };
  else if(last.ms > rm)             S.hlc = { ms:last.ms, c:last.c + 1 };
  else                              S.hlc = { ms:rm, c:rc + 1 };
  save('set');
  return S.hlc;
}
/* The three fields every record and every nested entry carries. */
function newStamp(){
  const t = hlcNow();
  return { upd:t.ms, ctr:t.c, dev:deviceId() };
}
/* Marks a record as edited here, now. Every write goes through this. */
function stamp(rec){ return Object.assign(rec, newStamp()); }

/* When a record was created, read back out of its own id — uid() puts the
   millisecond in the first characters. Records written before this app could
   sync have no edit stamp, and this recovers a sensible one for them.

   It matters that it is derived rather than invented: both phones read the
   same id and get the same answer, so a ledger copied to a second phone
   before any of this existed still merges cleanly instead of every record
   looking newer on whichever phone was opened last. */
function bornAt(id){
  const ms = parseInt(String(id || '').slice(0, -5), 36);
  return (ms > 1577836800000 && ms < Date.now() + 86400000) ? ms : 0;
}
/* A stable id for a nested entry that predates ids, derived from what it
   holds. Invented ids would differ between the two phones and the same
   prepayment would merge in twice. The position is folded in so two genuinely
   identical entries stay two. */
function contentId(e, ix){
  const text = [e.date || '', e.amount || '', e.note || '', ix].join('|');
  let h = 0x811c9dc5;
  for(let i = 0; i < text.length; i++){
    h ^= text.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return 'x' + h.toString(36);
}
function migrateForSync(){
  for(const name of LISTS){
    for(const r of DB[name]){
      if(!r || typeof r !== 'object') continue;
      if(!r.upd) r.upd = bornAt(r.id);
      for(const key of nestedKeys(name)){
        if(!Array.isArray(r[key])) continue;
        r[key].forEach((e, ix) => {
          if(e && typeof e === 'object'){
            if(!e.id)  e.id  = contentId(e, ix);
            if(!e.upd) e.upd = r.upd || 0;
          }
        });
      }
    }
  }
}

/* Which of two versions of the same record stands. Equal stamps fall back to
   the device id, so the answer does not depend on which phone is doing the
   merging — without that the two phones settle on different records and stay
   different for ever. */
function newerOf(a, b){
  const ua = a.upd || 0, ub = b.upd || 0;
  if(ua !== ub) return ua > ub ? a : b;
  const ca = a.ctr || 0, cb = b.ctr || 0;      // the logical half of the clock
  if(ca !== cb) return ca > cb ? a : b;
  return String(a.dev || '') >= String(b.dev || '') ? a : b;
}
function tombstone(id){
  DB.tomb = (DB.tomb || []).filter(t => t.id !== id);
  DB.tomb.push(Object.assign({ id }, newStamp()));
  save('tomb');
}
/* A tombstone only buries a record that has not been edited since. Editing
   something on one phone while the other deletes it brings it back, and the
   merge report says so — silently losing an edit is worse than a record that
   has to be deleted twice. */
function buried(tomb, rec){
  const t = tomb.get(rec.id);
  // Same comparison as everything else, so a delete and an edit are ordered
  // against each other by the one rule rather than two that can disagree.
  return !!t && newerOf(t, rec) === t;
}

function mergeNested(key, a, b){
  const map = new Map();
  for(const e of (a[key] || [])) if(e && e.id) map.set(e.id, e);
  for(const e of (b[key] || [])){
    if(!e || !e.id) continue;
    const have = map.get(e.id);
    if(!have || newerOf(have, e) === e) map.set(e.id, e);
  }
  /* Sorted, and not by accident.

     Taking them in the order they happened to be in leaves each phone with
     the same entries in a different order — whichever list it started from
     comes first. The contents would agree while the arrays did not, which for
     a price history is not cosmetic: the little line on the card is drawn in
     array order, so one phone would show the price wandering up and down and
     the other the truth. Date first, then id, so both phones land on exactly
     the same array. */
  return Array.from(map.values()).sort((x,y) => {
    const dx = x.d || x.date || '', dy = y.d || y.date || '';
    return dx === dy ? String(x.id).localeCompare(String(y.id))
                     : dx.localeCompare(dy);
  });
}

/* Merges a sync file into what is on this phone. Returns what changed, so the
   screen can say it rather than the user having to go and look. */
function mergeSync(obj){
  const remote = (obj && obj.data) || {};
  const since  = S.lastMerge || 0;
  const rep = { added:0, updated:0, kept:0, removed:0, revived:0, clashes:[] };

  /* Take in the highest stamp anywhere in their file before deciding
     anything. After this, nothing this phone writes can sort below something
     it has already seen — which is the whole point of the counter, and the
     reason a slow clock stops being able to lose an edit. */
  let hm = 0, hc = 0;
  const see = e => {
    if(!e) return;
    const m = e.upd || 0, c = e.ctr || 0;
    if(m > hm || (m === hm && c > hc)){ hm = m; hc = c; }
  };
  for(const name of LISTS){
    for(const r of (remote[name] || [])){
      see(r);
      for(const key of nestedKeys(name))
        if(Array.isArray(r[key])) r[key].forEach(see);
    }
  }
  (remote.tomb || []).forEach(see);
  if(hm) hlcSee(hm, hc);

  // Tombstones first, and from both sides, so a delete made on either phone
  // is known before anything is decided.
  const tomb = new Map();
  for(const t of (DB.tomb || [])) if(t && t.id) tomb.set(t.id, t);
  for(const t of (remote.tomb || [])){
    if(!t || !t.id) continue;
    const have = tomb.get(t.id);
    if(!have || newerOf(have, t) === t) tomb.set(t.id, t);
  }

  for(const name of LISTS){
    const keys = nestedKeys(name);
    const byId = new Map();
    for(const r of DB[name]) if(r && r.id) byId.set(r.id, r);

    for(const rr of (remote[name] || [])){
      if(!rr || !rr.id) continue;
      const lr = byId.get(rr.id);
      if(!lr){ byId.set(rr.id, rr); rep.added++; continue; }

      const nested = {};
      for(const key of keys) nested[key] = mergeNested(key, lr, rr);
      const win = newerOf(lr, rr);

      // Both phones edited this since the last merge. The newer one stands,
      // but it is named rather than swallowed: this is somebody's salary.
      if((lr.upd || 0) > since && (rr.upd || 0) > since &&
         JSON.stringify(lr) !== JSON.stringify(rr)){
        rep.clashes.push((name === 'spend' ? 'expense' : name.replace(/s$/,'')) +
                         ': ' + (lr.name || lr.note || lr.cat || lr.id));
      }
      const out = Object.assign({}, win);
      for(const key of keys) out[key] = nested[key];
      byId.set(rr.id, out);
      if(win === rr) rep.updated++; else rep.kept++;
    }

    let out = [];
    for(const r of byId.values()){
      if(buried(tomb, r)){ rep.removed++; continue; }
      if(tomb.has(r.id)) rep.revived++;          // edited after it was deleted
      for(const key of keys){
        if(Array.isArray(r[key])) r[key] = r[key].filter(e => !buried(tomb, e));
      }
      out.push(r);
    }
    DB[name] = out;
  }

  DB.tomb = Array.from(tomb.values());
  // Categories are additive: a category one of us added is not a reason to
  // lose one the other added. Everything else in settings — theme, the month
  // being looked at — belongs to the phone it is on and is left alone.
  if(obj.settings && Array.isArray(obj.settings.spendCats)){
    for(const c of obj.settings.spendCats)
      if(!S.spendCats.includes(c)) S.spendCats.push(c);
  }
  S.lastMerge = Date.now();
  S.lastMergeWith = (obj.settings && obj.settings.dev) || '?';

  for(const name of LISTS) save(name);
  save('tomb'); save('set');
  return rep;
}

/* =====================================================================
   The arithmetic
   Every formula is written out against its own definition and never chained
   through another one, so an error in one cannot travel into the rest. The
   UI prints the working beside each answer for the same reason: a wrong
   number renders exactly as convincingly as a right one.
   ===================================================================== */

/* Spending categories, grouped.

   Grouped because a flat list this long is a scroll on a phone and nobody
   reads to the bottom of it — the first plausible line gets picked and the
   figures quietly stop meaning anything. The groups are only for the picker;
   what is stored on an expense is the plain name, so nothing depends on which
   group a category sits in and moving one breaks nothing.

   The list is meant to be cut down. Most households use fifteen of these.
   Settings takes the ones you do not want out, and anything typed in there
   that is not below appears in the picker under "Yours". */
const CAT_GROUPS = [
  { g:'Home', c:['Rent','Maintenance','Electricity','Water','Cooking gas',
                 'Internet','Phone','Repairs','Household help','Furniture'] },
  { g:'Food', c:['Groceries','Vegetables & fruit','Eating out','Food delivery'] },
  { g:'Getting about', c:['Fuel','Car','Parking & tolls','Taxi & auto',
                          'Bus & train','Flights','Travel'] },
  { g:'Family', c:['School fees','Tuition & coaching','Books & stationery',
                   'Children','Parents','Family','Gifts','Festivals','Donations'] },
  { g:'Health', c:['Medical','Medicines','Dental','Gym & fitness'] },
  { g:'Personal', c:['Clothes','Grooming','Entertainment','Subscriptions',
                     'Hobbies','Education'] },
  // This ledger belongs to a ship's officer. Joining travel, a visa, a renewed
  // certificate and a calling card are real money that would otherwise all end
  // up filed under Other, which is the same as not recording it.
  { g:'At sea', c:['Joining travel','Documents & visa','Courses & certificates',
                   'Uniform & PPE','Ship phone & internet'] },
  { g:'Money', c:['Insurance','Taxes','Bank charges','Professional fees'] },
  { g:'', c:['Other'] }
];
const DEFAULT_CATS = CAT_GROUPS.reduce((a,g) => a.concat(g.c), []);

/* The picker. A category already on a record but no longer in the list still
   has to be selectable, or opening an old expense to change its amount would
   silently re-file it under whatever happens to be first. */
function catOptions(sel){
  const out = [], known = new Set();
  for(const grp of CAT_GROUPS){
    const list = grp.c.filter(c => S.spendCats.includes(c));
    list.forEach(c => known.add(c));
    if(!list.length) continue;
    out.push(grp.g ? '<optgroup label="' + esc(grp.g) + '">' + opts(list, sel) +
                     '</optgroup>'
                   : opts(list, sel));
  }
  const yours = S.spendCats.filter(c => !known.has(c));
  if(yours.length) out.push('<optgroup label="Yours">' + opts(yours, sel) + '</optgroup>');
  if(sel && !S.spendCats.includes(sel)){
    out.unshift('<option value="' + esc(sel) + '" selected>' + esc(sel) +
                ' — no longer in your list</option>');
  }
  return out.join('');
}

const FREQ = {                       // how many times a year it happens
  monthly:{n:12, label:'monthly'},
  quarterly:{n:4, label:'quarterly'},
  half:{n:2,     label:'half-yearly'},
  yearly:{n:1,   label:'yearly'},
  once:{n:0,     label:'one-off'}
};
/* A yearly bonus is not a twelfth of itself every month, but for "what does
   this year look like" it has to be spread somehow. Both figures are shown:
   perMonth for the averaged view, dueIn() for the month it actually lands. */
function perMonth(amount, freq){
  const f = FREQ[freq];
  return (!f || !f.n) ? 0 : amount * f.n / 12;
}
/* Does a recurring item fall in month m? Anchored on its start month, so a
   quarterly item started in February lands in Feb, May, Aug, Nov — not on the
   calendar quarter, which is a different thing and not what was entered. */
function fallsIn(item, m){
  const start = ym(item.start || '');
  if(!start || m < start) return false;
  if(item.end && m > ym(item.end)) return false;
  const f = FREQ[item.freq] || FREQ.monthly;
  if(f.n === 0) return start === m;                      // one-off
  const step = 12 / f.n;
  return monthDiff(start, m) % step === 0;
}
function dueIn(item, m){ return fallsIn(item, m) ? toNum(item.amount) : 0; }

/* ---------- loans ----------
   Reducing balance, interest charged monthly on the opening balance:

       i = rate / 12 / 100
       interest_this_month = balance * i
       balance = balance + interest - EMI - any extra payment that month

   The schedule is simulated month by month rather than solved in closed form,
   because a prepayment part-way through has no closed form — and prepayment
   is the whole reason anyone opens this screen. */
/* The rate in force in a given month.

   A home loan here is floating. The rate on the card is only the rate it
   started at; when the bank moves it, every figure downstream — the balance,
   the interest paid so far, the month it clears — is wrong from that date on,
   and wrong quietly, because the card goes on printing a confident number.
   So the rate is a dated list, exactly like the prepayments, and the schedule
   reads it month by month.

   When the rate moves, the bank's default is to keep the EMI and let the
   tenure move. That is what falls out of running the schedule to the month
   the balance clears, rather than to a fixed count — so it is the behaviour
   already, and it is the one to keep. */
function rateAt(loan, m){
  let r = toNum(loan.rate);
  const changes = (loan.rates || []).slice()
    .sort((a,b) => (a.from||'').localeCompare(b.from||''));
  for(const c of changes){
    if(ym(c.from || '') <= m) r = toNum(c.rate); else break;
  }
  return r;
}
function loanRate(loan, m){ return rateAt(loan, m || ym(loan.start) || thisMonth()) / 12 / 100; }

/* Standard EMI, used to fill the field when the lender's figure is not to
   hand: EMI = P i (1+i)^n / ((1+i)^n - 1). At zero interest it is P/n, which
   the formula cannot express (0/0). */
function emiFor(principal, ratePa, months){
  const P = toNum(principal), n = Math.round(toNum(months)), i = toNum(ratePa)/12/100;
  if(P <= 0 || n <= 0) return 0;
  if(i === 0) return P / n;
  const g = Math.pow(1+i, n);
  return P * i * g / (g - 1);
}

/* Runs the loan to its end. Returns every month, so the caller can ask for a
   schedule, a balance on a date, or the interest paid so far, off one run. */
function amortise(loan, limit){
  const P = toNum(loan.principal);
  const emi = toNum(loan.emi) || emiFor(P, loan.rate, loan.months);
  const start = ym(loan.start) || thisMonth();
  const cap = limit || 1200;                       // 100 years is not a loan
  const extras = (loan.extras || []).slice()
        .sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const rows = [];
  let bal = P, paidInt = 0, paidPri = 0, paidExtra = 0;

  if(P <= 0) return { rows, emi, balance:0, paidInt:0, paidPri:0, paidExtra:0,
                      payoff:null, months:0, totalInt:0, never:false };

  // An EMI at or below the month's interest never touches the principal. That
  // can be true from the start, or become true after the bank raises the rate
  // — which is the case worth catching, because the card would otherwise print
  // a payoff a century away as though it meant something.
  let never = false;

  for(let k = 0; k < cap && bal > 0.005; k++){
    const m = monthAdd(start, k);
    const i = rateAt(loan, m) / 12 / 100;
    const open = bal;
    const interest = open * i;
    if(emi > 0 && i > 0 && emi <= interest){
      const relief = extras.filter(x => ym(x.date) === m)
                           .reduce((t,x) => t + toNum(x.amount), 0);
      if(relief <= 0){ never = true; break; }
    }
    let pay = Math.min(emi, open + interest);       // last instalment is short
    const extra = extras.filter(x => ym(x.date) === m)
                        .reduce((s,x) => s + toNum(x.amount), 0);
    let close = open + interest - pay - extra;
    let extraUsed = extra;
    if(close < 0){ extraUsed = extra + close; close = 0; }   // do not overpay
    rows.push({ n:k+1, month:m, open, interest, principal:pay - interest,
                pay, extra:extraUsed, close });
    paidInt += interest; paidPri += pay - interest; paidExtra += extraUsed;
    bal = close;
  }
  const last = rows.length ? rows[rows.length-1] : null;
  return {
    rows, emi, never,
    balance: bal,
    paidInt, paidPri, paidExtra,
    months: rows.length,
    payoff: never ? null : (last ? last.month : null),
    totalInt: paidInt
  };
}
/* Where the loan stands at the end of month m — what is still owed, what has
   gone in interest so far. Anything after the payoff month reads as closed. */
function loanAt(loan, m){
  const a = amortise(loan);
  let bal = toNum(loan.principal), int = 0, pri = 0, n = 0;
  for(const r of a.rows){
    if(r.month > m) break;
    bal = r.close; int += r.interest; pri += r.principal + r.extra; n = r.n;
  }
  if(!a.rows.length) return { balance:0, interest:0, principal:0, paid:0, a };
  if(m < a.rows[0].month) return { balance:toNum(loan.principal), interest:0,
                                   principal:0, paid:0, a };
  return { balance:bal, interest:int, principal:pri, paid:n, a };
}
/* The EMI actually due in month m — nothing before it starts, nothing after
   it is paid off, and the short final instalment at its real size. */
function loanDue(loan, m){
  if(loan.closed) return 0;
  const a = amortise(loan);
  const row = a.rows.find(r => r.month === m);
  return row ? row.pay : 0;
}

/* ---------- deposits ----------
   FD, cumulative: A = P (1 + r/(100 n))^(n t), n compounds a year.
   Indian banks compound a term deposit quarterly, so n = 4 is the default and
   is shown on the card rather than hidden, because at 7% the difference
   between quarterly and yearly over five years is real money.

   FD, interest paid out: the principal never grows. Payout per period is
   P r / (100 n) and the maturity value is the principal back. */
function fdValue(fd, atIso){
  const P = toNum(fd.principal), r = toNum(fd.rate), n = toNum(fd.comp) || 4;
  const months = Math.round(toNum(fd.months));
  const start = dateFromIso(fd.start), at = dateFromIso(atIso || today());
  if(P <= 0 || !start) return { value:P, maturity:P, interest:0, matures:null, years:0 };
  const matures = monthAdd(ym(fd.start), months);
  const tFull = months / 12;
  const grow = (t) => (fd.payout === 'periodic') ? P : P * Math.pow(1 + r/(100*n), n*t);
  const maturity = grow(tFull);
  let elapsed = Math.max(0, monthsBetween(fd.start, atIso || today())) / 12;
  if(elapsed > tFull) elapsed = tFull;
  const value = grow(elapsed);
  return { value, maturity, interest: maturity - P, matures,
           years: tFull, elapsed,
           periodic: (fd.payout === 'periodic') ? P * r / (100*n) : 0 };
}
/* RD: one instalment a month, each compounded for the time it has left to
   run. The bank compounds quarterly, so an instalment sitting for k months
   earns (1 + r/400)^(k/3) — the quarterly rate applied over k/3 quarters,
   which is how the banks' own RD tables are built.

       M = SUM over i of  A (1 + r/400)^((N - i + 1)/3)

   Not A x N x (1+r) x something. The single-rate shortcut is out by several
   thousand rupees over a five-year RD, always in the bank's favour. */
function rdValue(rd, atIso){
  const A = toNum(rd.monthly), r = toNum(rd.rate), n = toNum(rd.comp) || 4;
  const N = Math.round(toNum(rd.months));
  const startM = ym(rd.start);
  if(A <= 0 || N <= 0 || !startM) return { value:0, maturity:0, paid:0,
                                           interest:0, matures:null, done:0 };
  const q = 1 + r / (100 * n);
  const per = 12 / n;                          // months in one compounding period
  let maturity = 0;
  for(let k = 1; k <= N; k++) maturity += A * Math.pow(q, (N - k + 1) / per);

  const nowM = ym(atIso || today());
  let done = monthDiff(startM, nowM) + 1;
  if(done < 0) done = 0; if(done > N) done = N;
  let value = 0;
  for(let k = 1; k <= done; k++) value += A * Math.pow(q, (done - k + 1) / per);

  return { value, maturity, paid: A * done, done, N,
           interest: maturity - A * N, matures: monthAdd(startM, N) };
}
/* Bond: held at what it is worth now if a price was entered, otherwise at
   what was paid. Coupon is on face value, never on the price paid — a bond
   bought at 96 still pays its coupon on 100. */
function bondValue(b){
  const units = toNum(b.units) || 0, face = toNum(b.face) || 0;
  const buy = toNum(b.buy) || face, price = toNum(b.price) || buy;
  return { cost: units*buy, value: units*price,
           coupon: units * face * toNum(b.coupon) / 100,
           matures: b.maturity || null };
}
/* Equity and mutual funds: units x the price last written down, and the date
   it was written down, so a stale figure is visibly stale rather than
   quietly wrong. */
function unitValue(h){
  const units = toNum(h.units), buy = toNum(h.buy), price = toNum(h.price) || buy;
  const cost = units*buy, value = units*price;
  return { cost, value, gain:value-cost, gainPct: cost ? (value-cost)/cost*100 : 0 };
}
/* One holding, whatever its kind, reduced to cost / value / income. */
function holdingValue(h, atIso){
  if(h.kind === 'fd'){
    const v = fdValue(h, atIso);
    return { cost:toNum(h.principal), value:v.value, gain:v.value - toNum(h.principal),
             income:v.periodic * (toNum(h.comp)||4), detail:v };
  }
  if(h.kind === 'rd'){
    const v = rdValue(h, atIso);
    return { cost:v.paid, value:v.value, gain:v.value - v.paid, income:0, detail:v };
  }
  if(h.kind === 'bond'){
    const v = bondValue(h);
    return { cost:v.cost, value:v.value, gain:v.value - v.cost, income:v.coupon, detail:v };
  }
  const v = unitValue(h);
  return { cost:v.cost, value:v.value, gain:v.gain, income:0, detail:v };
}
const KINDS = { equity:'Equity', mf:'Mutual fund', bond:'Bond', fd:'Fixed deposit',
                rd:'Recurring deposit' };
/* The kinds that carry a price somebody has to write down. A deposit's worth
   is computed from its own terms and needs no price. */
const PRICED = { equity:1, mf:1, bond:1 };

/* ---------- what a holding was worth, and when ----------
   Every price that goes in is kept, dated, one point a day. That is what the
   little line on each card is drawn from, and it is the seam an online price
   would arrive through later: a fetched quote writes the same point with
   src:'fetched' instead of 'typed', against the same ticker in `code`, and
   nothing else in the app has to know the difference. */
function notePrice(h){
  if(!PRICED[h.kind]) return;
  const p = toNum(h.price);
  if(!(p > 0)) return;
  const d = h.asof || today();
  h.hist = Array.isArray(h.hist) ? h.hist : [];
  const at = h.hist.find(x => x.d === d);
  if(at){
    if(toNum(at.p) !== p){ at.p = p; Object.assign(at, newStamp()); }
    return;
  }
  h.hist.push(Object.assign({ id:uid() }, newStamp(), { d, p, src:'typed' }));
  h.hist.sort((a,b) => (a.d||'').localeCompare(b.d||''));
}

/* What the whole portfolio was worth on a given day.

   Recorded as it happens rather than reconstructed afterwards. Reconstructing
   it would mean applying today's number of shares to last year's prices,
   because the app keeps no history of how many shares were held when — and
   that produces a line that looks authoritative and is wrong. A point written
   down on the day is simply true. */
function noteSnapshot(){
  let value = 0, cost = 0;
  for(const h of DB.invest){
    if(h.closed) continue;
    const v = holdingValue(h);
    value += v.value; cost += v.cost;
  }
  const d = today();
  const at = DB.snap.find(x => x.d === d);
  if(at){
    if(Math.abs(toNum(at.value) - value) < 0.005 &&
       Math.abs(toNum(at.cost)  - cost)  < 0.005) return;
    at.value = value; at.cost = cost; Object.assign(at, newStamp());
  }else{
    DB.snap.push(Object.assign({ id:uid() }, newStamp(), { d, value, cost }));
    DB.snap.sort((a,b) => (a.d||'').localeCompare(b.d||''));
  }
  save('snap');
}

/* =====================================================================
   Rendering
   ===================================================================== */
const $ = s => document.querySelector(s);
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function el(id){ return document.getElementById(id); }

/* ---------- the pie ----------
   Drawn by hand in SVG: no library can be fetched here, and a chart is a few
   arcs. It is a donut rather than a filled pie because the hole is where the
   total goes, and reading one number in the middle beats reading a caption.

   Six hues at most, in a fixed order, with everything past the sixth folded
   into one grey "Other" slice. Slices are never recoloured by rank — a
   category keeps its colour as the figures move, or a glance month to month
   means nothing. Both palettes were checked for colour-blind separation
   against this app's own card colours rather than eyeballed; every slice is
   also labelled and repeated in the list beneath, so no slice is told apart
   by its colour alone. */
const PIE_LIGHT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300'];
const PIE_DARK  = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];
const PIE_OTHER_LIGHT = '#8A8F96', PIE_OTHER_DARK = '#7C858F';
function pieColours(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  return { set: dark ? PIE_DARK : PIE_LIGHT,
           other: dark ? PIE_OTHER_DARK : PIE_OTHER_LIGHT,
           surface: dark ? '#1A232C' : '#FFFFFF' };
}
/* parts: [{label, value}] — already positive. Returns markup for the donut
   and its list. Anything below 1% of the total is folded into Other too:
   a one-degree slice is a line, not a quantity. */
function donut(parts, centreLabel, centreValue){
  const c = pieColours();
  const clean = parts.filter(p => toNum(p.value) > 0)
                     .sort((a,b) => b.value - a.value);
  const total = clean.reduce((s,p) => s + p.value, 0);
  if(!total) return '<div class="empty">Nothing to chart yet.</div>';

  const keep = [], rest = [];
  for(const p of clean){
    (keep.length < PIE_LIGHT.length && p.value / total >= 0.01 ? keep : rest).push(p);
  }
  const slices = keep.map((p,i) => ({...p, colour:c.set[i]}));
  if(rest.length){
    slices.push({ label: rest.length === 1 ? rest[0].label : 'Other (' + rest.length + ')',
                  value: rest.reduce((s,p) => s + p.value, 0), colour:c.other });
  }

  const R = 62, W = 22, C = 2 * Math.PI * R, GAP = 2;
  let at = 0, arcs = '', labels = '';
  for(const s of slices){
    const frac = s.value / total;
    const len = Math.max(C * frac - GAP, 0.6);
    arcs += '<circle class="sl" cx="90" cy="90" r="' + R + '" fill="none" stroke="' +
            s.colour + '" stroke-width="' + W + '" stroke-dasharray="' +
            len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' +
            (-C * at).toFixed(2) + '"><title>' + esc(s.label) + ' — ' +
            esc(money(s.value)) + ' (' + (frac*100).toFixed(1) + '%)</title></circle>';
    // A slice under 7% has no room for a number on it; it is read off the list.
    if(frac >= 0.07){
      const mid = (at + frac/2) * 2 * Math.PI - Math.PI/2;
      const rr = R;
      labels += '<text x="' + (90 + rr*Math.cos(mid)).toFixed(1) + '" y="' +
                (90 + rr*Math.sin(mid)).toFixed(1) + '" class="plab">' +
                Math.round(frac*100) + '%</text>';
    }
    at += frac;
  }
  const list = slices.map(s =>
    '<div class="kv"><span class="k"><i class="sw" style="background:' + s.colour +
    '"></i>' + esc(s.label) + '</span><span class="num">' + esc(money(s.value)) +
    ' <span class="muted tiny">' + (s.value/total*100).toFixed(1) + '%</span></span></div>'
  ).join('');

  return '<div class="pie-wrap"><svg viewBox="0 0 180 180" class="pie" role="img" ' +
    'aria-label="' + esc(centreLabel) + ' ' + esc(centreValue) + '">' +
    '<g transform="rotate(-90 90 90)">' + arcs + '</g>' + labels +
    '<text x="90" y="84" class="pc1" style="font-size:' +
    (String(centreValue).length > 11 ? 12 : String(centreValue).length > 8 ? 14 : 16) +
    'px">' + esc(centreValue) + '</text>' +
    '<text x="90" y="100" class="pc2">' + esc(centreLabel) + '</text></svg>' +
    '<div class="pie-list">' + list + '</div></div>';
}

/* ---------- the line on a card ----------
   One series, so no legend and no axis: the card around it already says what
   it is and what it is worth now. Green up, red down, against where it
   started — the only question a line this small can answer. */
function sparkline(points, w, h){
  const ps = (points || []).map(x => toNum(x.p)).filter(v => v > 0);
  if(ps.length < 2) return '';
  const lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
  const span = (hi - lo) || Math.abs(lo) || 1;
  const step = (w - 4) / (ps.length - 1);
  const y = v => (h - 2 - (v - lo) / span * (h - 4)).toFixed(1);
  const d = ps.map((v, i) => (2 + i * step).toFixed(1) + ',' + y(v)).join(' ');
  const up = ps[ps.length - 1] >= ps[0];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w +
    '" height="' + h + '" aria-hidden="true"><polyline points="' + d +
    '" fill="none" stroke="' + (up ? 'var(--in)' : 'var(--out)') +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + (2 + (ps.length-1) * step).toFixed(1) + '" cy="' +
    y(ps[ps.length-1]) + '" r="2.5" fill="' + (up ? 'var(--in)' : 'var(--out)') +
    '"/></svg>';
}

/* ---------- value over time ----------
   Two series on one axis, both in rupees — never two scales, which is the one
   thing that makes a chart lie outright. What it is worth is the point and
   carries the colour; what went in is context and stays grey. Both are
   labelled at the end where the eye finishes, so neither is read by colour
   alone, and the axis starts at zero because these are amounts. */
function lineChart(rows){
  const pts = (rows || []).slice()
    .sort((a,b) => (a.d||'').localeCompare(b.d||''))
    .filter(r => r.d);
  if(pts.length < 2){
    return '<div class="empty">One reading so far. The line starts at the ' +
           'second — update your prices again in a week.</div>';
  }
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const VAL = dark ? '#3987e5' : '#2a78d6';
  const COST = dark ? '#7C858F' : '#8A8F96';

  const W = 320, H = 150, L = 6, R = 62, Tp = 16, B = 32;
  const t = r => dateFromIso(r.d).getTime();
  const t0 = t(pts[0]), t1 = t(pts[pts.length-1]);
  const tspan = (t1 - t0) || 1;

  /* The scale runs over the figures, not from zero.

     A bar has to start at zero because its length is the quantity. A line
     does not: its shape is the quantity, and forcing the axis to zero on a
     portfolio that went from eight lakh to nine squeezes the entire story
     into the top fifth of the box and shows a flat line. That is not
     conservative, it is just unreadable.

     The price of that is a scale that can flatter a small change, so both
     ends of it are written on the chart and the note underneath says so. */
  const all = pts.reduce((a,r) => a.concat([toNum(r.value), toNum(r.cost)]), []);
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  const pad = (hi - lo) * 0.14 || Math.abs(hi) * 0.05 || 1;
  lo = Math.max(0, lo - pad); hi = hi + pad;
  const span = (hi - lo) || 1;

  const x = r => (L + (t(r) - t0) / tspan * (W - L - R));
  const y = v => (Tp + (1 - (v - lo) / span) * (H - Tp - B));
  const path = key => pts.map((r,i) => (i ? 'L' : 'M') + x(r).toFixed(1) + ' ' +
        y(toNum(r[key])).toFixed(1)).join(' ');

  const last = pts[pts.length-1];
  const grid = [lo, (lo+hi)/2, hi].map(v =>
    '<line x1="' + L + '" x2="' + (W-R) + '" y1="' + y(v).toFixed(1) +
    '" y2="' + y(v).toFixed(1) + '" class="gl"/>').join('');

  return '<svg class="line" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="What the portfolio has been worth, against what was put in">' +
    grid +
    '<path d="' + path('cost')  + '" fill="none" stroke="' + COST +
      '" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="' + path('value') + '" fill="none" stroke="' + VAL +
      '" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="' + x(last).toFixed(1) + '" cy="' + y(toNum(last.value)).toFixed(1) +
      '" r="3" fill="' + VAL + '"/>' +
    '<text x="' + (W-R+6) + '" y="' + (y(toNum(last.value)) + 3).toFixed(1) +
      '" class="ll">' + esc(money(toNum(last.value))) + '</text>' +
    '<text x="' + (W-R+6) + '" y="' + (y(toNum(last.cost)) + 3).toFixed(1) +
      '" class="ll dim">' + esc(money(toNum(last.cost))) + '</text>' +
    '<text x="' + L + '" y="' + (H-4) + '" class="ax">' +
      esc(shortMonth(ym(pts[0].d))) + '</text>' +
    '<text x="' + (W-R) + '" y="' + (H-4) + '" class="ax" text-anchor="end">' +
      esc(shortMonth(ym(last.d))) + '</text>' +
    '<text x="' + L + '" y="' + (y(hi) - 4).toFixed(1) + '" class="ax">' +
      esc(money(hi)) + '</text>' +
    '<text x="' + L + '" y="' + (y(lo) + 10).toFixed(1) + '" class="ax">' +
      esc(money(lo)) + '</text>' +
    '</svg>' +
    '<div class="row" style="gap:14px;margin-top:2px">' +
    '<span class="tiny"><i class="sw" style="background:' + VAL +
      '"></i> Worth now</span>' +
    '<span class="tiny"><i class="sw" style="background:' + COST +
      '"></i> Put in</span>' +
    '<span class="tiny muted" style="margin-left:auto">' + pts.length +
      ' readings</span></div>';
}

/* ---------- small builders ---------- */
function kv(k, v, cls){
  return '<div class="kv' + (cls ? ' ' + cls : '') + '"><span class="k">' + esc(k) +
         '</span><span class="num">' + v + '</span></div>';
}
function emptyMsg(t){ return '<div class="empty">' + esc(t) + '</div>'; }
function barPct(done, target){
  const p = target > 0 ? done / target * 100 : 0;
  return '<div class="bar' + (p > 100 ? ' over' : '') + '"><i style="width:' +
         Math.max(0, Math.min(100, p)).toFixed(1) + '%"></i></div>';
}
function opts(list, sel){
  return list.map(o => {
    const v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
    return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' +
           esc(t) + '</option>';
  }).join('');
}

/* ---------- tabs ---------- */
let TAB = 'month';
function show(tab){
  TAB = tab;
  document.querySelectorAll('#nav button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  document.querySelectorAll('main section[role=tabpanel]').forEach(s =>
    s.hidden = (s.id !== 'tab-' + tab));
  render();
  window.scrollTo(0,0);
}

/* ---------- the editor dialog ----------
   One dialog serves every record. It is handed a list of fields and a record;
   it gives back a record. Adding a kind of holding is a line in a table, not
   another form to keep in step with the rest. */
let DLG = null;
function editor(title, fields, rec, onSave, onDelete){
  DLG = { fields, rec, onSave, onDelete };
  el('dlgTitle').textContent = title;
  el('dlgDelete').style.display = onDelete ? '' : 'none';
  drawFields();
  openDialog();
  const first = el('dlgBody').querySelector('input,select,textarea');
  if(first && !first.readOnly) setTimeout(() => first.focus(), 50);
}
/* <dialog> and showModal landed in Safari 15.4. An older iPad aboard would
   otherwise reach a dead button: the editor simply would not open, with
   nothing on screen to say why. The fallback shows the same markup as a
   plain fixed panel. */
function openDialog(){
  const d = el('dlg');
  if(typeof d.showModal === 'function'){ d.showModal(); }
  else { d.classList.add('fallback'); d.setAttribute('open',''); }
}
function closeDialog(){
  const d = el('dlg');
  if(typeof d.close === 'function' && d.open){ d.close(); }
  d.removeAttribute('open');
  d.classList.remove('fallback');
}
function drawFields(){
  const { fields, rec } = DLG;
  el('dlgBody').innerHTML = fields.map(f => {
    if(f.type === 'head') return '<h2 style="margin:14px 0 6px;font-size:12px;' +
      'text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)">' +
      esc(f.label) + '</h2>';
    if(f.type === 'note') return '<p class="small muted" style="margin:2px 0 10px">' +
      f.label + '</p>';
    const v = rec[f.k] === undefined || rec[f.k] === null ? '' : rec[f.k];
    let input;
    if(f.type === 'select'){
      input = '<select data-k="' + f.k + '">' +
        (f.cats ? catOptions(String(v)) : opts(f.options, String(v))) + '</select>';
    }else if(f.type === 'textarea'){
      input = '<textarea data-k="' + f.k + '" rows="2">' + esc(v) + '</textarea>';
    }else if(f.type === 'check'){
      return '<div class="f"><label style="display:flex;gap:8px;align-items:center;' +
        'font-size:14px;color:var(--ink)"><input type="checkbox" data-k="' + f.k +
        '"' + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label></div>';
    }else{
      const t = f.type === 'date' ? 'date' : (f.type === 'money' || f.type === 'number'
        ? 'number' : 'text');
      const step = f.type === 'money' ? ' step="0.01"' : (f.type === 'number'
        ? ' step="' + (f.step || 'any') + '"' : '');
      input = '<input type="' + t + '" data-k="' + f.k + '" value="' + esc(v) + '"' +
        step + (f.type === 'money' || f.type === 'number' ? ' inputmode="decimal"' : '') +
        (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>';
    }
    return '<div class="f' + (f.half ? ' half' : '') + '"><label>' + esc(f.label) +
           (f.hint ? ' <span class="muted">' + esc(f.hint) + '</span>' : '') +
           '</label>' + input + '</div>';
  }).join('');
  // Pair adjacent half fields into two columns without a wrapper per pair.
  const body = el('dlgBody');
  let i = 0, kids = Array.from(body.children);
  while(i < kids.length){
    if(kids[i].classList && kids[i].classList.contains('half') &&
       kids[i+1] && kids[i+1].classList.contains('half')){
      const g = document.createElement('div');
      g.className = 'f2';
      kids[i].parentNode.insertBefore(g, kids[i]);
      g.appendChild(kids[i]); g.appendChild(kids[i+1]);
      i += 2;
    } else i++;
  }
}
function readFields(){
  const out = Object.assign({}, DLG.rec);
  el('dlgBody').querySelectorAll('[data-k]').forEach(n => {
    const f = DLG.fields.find(x => x.k === n.dataset.k) || {};
    out[n.dataset.k] = n.type === 'checkbox' ? n.checked
      : (f.type === 'money' || f.type === 'number' ? (n.value === '' ? '' : toNum(n.value))
      : n.value);
  });
  return out;
}

/* =====================================================================
   Month — what came in, what went out, what is left
   ===================================================================== */
function monthFigures(m){
  const incomeDue = DB.income.reduce((s,i) => s + dueIn(i, m), 0);
  const received  = DB.receipt.filter(r => ym(r.date) === m)
                              .reduce((s,r) => s + toNum(r.amount), 0);
  const emi       = DB.loans.reduce((s,l) => s + loanDue(l, m), 0);
  const prepay    = DB.loans.reduce((s,l) => s + (l.extras||[])
                      .filter(x => ym(x.date) === m)
                      .reduce((t,x) => t + toNum(x.amount), 0), 0);
  const fixed     = DB.fixed.reduce((s,f) => s + dueIn(f, m), 0);
  const spendRows = DB.spend.filter(x => ym(x.date) === m);
  const spend     = spendRows.reduce((s,x) => s + toNum(x.amount), 0);
  const saved     = DB.goals.reduce((s,g) => s + (g.ledger||[])
                      .filter(x => ym(x.date) === m)
                      .reduce((t,x) => t + toNum(x.amount), 0), 0);
  const invested  = DB.invest.filter(h => h.kind === 'rd' && !h.closed)
                      .reduce((s,h) => {
                        const v = rdValue(h, m + '-28');
                        return s + (fallsIn({start:h.start, freq:'monthly',
                          end: monthAdd(ym(h.start), Math.round(toNum(h.months))-1) + '-28'}, m)
                          ? toNum(h.monthly) : 0);
                      }, 0);
  const out = emi + prepay + fixed + spend + saved + invested;
  return { m, incomeDue, received, emi, prepay, fixed, spend, spendRows, saved,
           invested, out, left: incomeDue - out };
}
function netWorth(atIso){
  let assets = 0, cost = 0;
  for(const h of DB.invest){
    if(h.closed) continue;
    assets += holdingValue(h, atIso).value;
    cost   += holdingValue(h, atIso).cost;
  }
  const pots = DB.goals.reduce((s,g) => s + goalSaved(g), 0);
  const m = ym(atIso || today());
  const debt = DB.loans.reduce((s,l) => s + (l.closed ? 0 : loanAt(l, m).balance), 0);
  return { assets, cost, pots, debt, net: assets + pots - debt };
}
function goalSaved(g){
  return (g.ledger||[]).reduce((s,x) => s + toNum(x.amount), 0);
}

let PIE_VIEW = 'out';
function renderMonth(){
  const m = S.month, f = monthFigures(m), nw = netWorth();
  const prev = monthAdd(m, -1), next = monthAdd(m, 1);

  let h = '<div class="card"><div class="row" style="margin-bottom:10px">' +
    '<button class="btn sec sm" data-go-month="' + prev + '">&#8592; ' +
      esc(shortMonth(prev)) + '</button>' +
    '<div class="grow right" style="text-align:center;font-weight:600">' +
      esc(monthName(m)) + '</div>' +
    '<button class="btn sec sm" data-go-month="' + next + '">' +
      esc(shortMonth(next)) + ' &#8594;</button></div>';

  h += '<div class="right"><div class="muted small">Left over</div>' +
    '<div class="big ' + (f.left < 0 ? 'neg' : 'pos') + '">' + esc(money(f.left)) +
    '</div><div class="work">' + esc(money(f.incomeDue)) + ' in &minus; ' +
    esc(money(f.out)) + ' out</div></div>';

  h += kv('Income due', '<span class="pos">' + esc(money(f.incomeDue)) + '</span>');
  if(f.received) h += kv('Actually received', esc(money(f.received)));
  h += kv('Loan instalments', esc(money(f.emi)));
  if(f.prepay) h += kv('Prepayments', esc(money(f.prepay)));
  h += kv('Fixed outgoings (rent, etc.)', esc(money(f.fixed)));
  h += kv('Day-to-day spending', esc(money(f.spend)));
  if(f.invested) h += kv('Recurring deposits', esc(money(f.invested)));
  if(f.saved) h += kv('Put into goals', esc(money(f.saved)));
  h += kv('Left over', '<span class="' + (f.left<0?'neg':'pos') + '">' +
        esc(money(f.left)) + '</span>', 'tot');
  h += '</div>';

  /* The pie. Two things are worth seeing as a whole: where a month's money
     goes, and what the net worth is made of. Same chart, two questions. */
  h += '<div class="card"><div class="seg" style="margin-bottom:12px">' +
    '<button data-pie="out"    aria-pressed="' + (PIE_VIEW==='out') + '">Where it goes</button>' +
    '<button data-pie="assets" aria-pressed="' + (PIE_VIEW==='assets') + '">What I own</button>' +
    '<button data-pie="cat"    aria-pressed="' + (PIE_VIEW==='cat') + '">Spending</button></div>';

  if(PIE_VIEW === 'out'){
    const parts = [
      { label:'Loan instalments', value:f.emi + f.prepay },
      { label:'Fixed outgoings',  value:f.fixed },
      { label:'Recurring deposits', value:f.invested },
      { label:'Goals',            value:f.saved }
    ];
    const byCat = {};
    for(const s of f.spendRows) byCat[s.cat||'Other'] = (byCat[s.cat||'Other']||0) + toNum(s.amount);
    for(const c in byCat) parts.push({ label:c, value:byCat[c] });
    h += donut(parts, shortMonth(m) + ' out', money(f.out));
  }else if(PIE_VIEW === 'cat'){
    const byCat = {};
    for(const s of f.spendRows) byCat[s.cat||'Other'] = (byCat[s.cat||'Other']||0) + toNum(s.amount);
    h += donut(Object.keys(byCat).map(c => ({label:c, value:byCat[c]})),
               'spent', money(f.spend));
  }else{
    const byKind = {};
    for(const hd of DB.invest){
      if(hd.closed) continue;
      const v = holdingValue(hd).value;
      byKind[KINDS[hd.kind]||hd.kind] = (byKind[KINDS[hd.kind]||hd.kind]||0) + v;
    }
    const pots = DB.goals.reduce((s,g) => s + goalSaved(g), 0);
    if(pots) byKind['Goal savings'] = pots;
    h += donut(Object.keys(byKind).map(k => ({label:k, value:byKind[k]})),
               'assets', money(nw.assets + nw.pots));
  }
  h += '</div>';

  h += '<div class="card"><h2>Net worth</h2>' +
    kv('Investments at value', esc(money(nw.assets))) +

  const dueM = live.reduce((s,l) => s + loanDue(l, m), 0);

      ' · EMI ' + esc(money(a.emi)) + ' · ' + a.months + ' instalments</div>' +
      barPct(toNum(l.principal) - at.balance, toNum(l.principal)) +
      '<div class="tiny muted" style="margin-top:4px">' + paidPct.toFixed(1) +

    if(open){
      h += '<div style="margin-top:10px">' +
        kv('Interest paid so far', esc(money(at.interest))) +
        kv('Principal repaid so far', esc(money(at.principal))) +

        kv('Total repaid over the whole loan',
           esc(money(toNum(l.principal) + a.totalInt)), 'tot') +

        'Interest each month is charged on the opening balance, at the rate in ' +
        'force that month — ' + num(rateAt(l, m),2) + '% &divide; 12 = ' +
        num(rateAt(l, m)/12, 4) + '% for ' + esc(shortMonth(m)) +
        ((l.rates||[]).length
          ? '. The EMI is unchanged by a rate move, so the tenure moves instead, ' +

        h += '<div style="margin-top:8px" class="small"><strong>Rate changes</strong>' +

      h += '<details style="margin-top:8px"><summary>Every instalment</summary>' +

  el('tab-loans').innerHTML = h;

const FIXED_FIELDS = [
  { k:'name',   label:'What',   ph:'House rent, car insurance, school fees…' },
  { k:'amount', label:'Amount', type:'money', half:true },
  { k:'freq',   label:'How often', type:'select', half:true,

  { k:'cat',    label:'Category', type:'select', half:true, cats:true },
  { k:'start',  label:'First due', type:'date', half:true },
  { k:'end',    label:'Last due',  type:'date', half:true, hint:'(blank = ongoing)' },
  { k:'note',   label:'Note', type:'textarea' }
];
function spendFields(){
  return [
    { k:'date',   label:'Date',   type:'date', half:true },
    { k:'amount', label:'Amount', type:'money', half:true },
    { k:'cat',    label:'Category', type:'select', cats:true },
    { k:'note',   label:'What for', ph:'Diesel, groceries, service…' }
  ];

/* The categories most likely to be wanted next, most-used first over the last
   three months, topped up from the full list. Six, because that is what fits
   across a phone without wrapping into a wall. */
function quickCats(){
  const since = monthAdd(thisMonth(), -3) + '-01';
  const count = {};
  for(const x of DB.spend) if((x.date||'') >= since) count[x.cat] = (count[x.cat]||0) + 1;
  const out = Object.keys(count).sort((a,b) => count[b] - count[a]).slice(0,6);
  for(const c of S.spendCats){ if(out.length >= 6) break; if(!out.includes(c)) out.push(c); }
  return out;
}
let LAST_ADD = null;   // so a mis-tapped category can be taken straight back

/* Every expense, searched. The month view is the day-to-day one; this is for
   "what did that car service cost", which is unanswerable if only the current
   month is ever on screen. */
let SPEND_Q = '';
function spendSearch(q){
  const t = q.trim().toLowerCase();
  if(!t) return [];
  const asNum = toNum(t);
  return DB.spend.filter(x =>
      String(x.note||'').toLowerCase().includes(t) ||
      String(x.cat||'').toLowerCase().includes(t) ||
      (asNum > 0 && Math.abs(toNum(x.amount) - asNum) < 0.005))
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
}

/* Spending by month, most recent last. Same shape as the portfolio readings:
   one series, so no legend — the card's own heading says what it is. */
function monthTotals(n){
  const out = [];
  for(let k = n - 1; k >= 0; k--){
    const m = monthAdd(thisMonth(), -k);
    let fixed = 0, day = 0;
    for(const f of DB.fixed) fixed += dueIn(f, m);
    for(const x of DB.spend) if(ym(x.date) === m) day += toNum(x.amount);
    out.push({ m, fixed, day, total: fixed + day });
  }
  return out;
}
function monthBars(rows){
  const top = Math.max.apply(null, rows.map(r => r.total)) || 1;
  const now = thisMonth();
  return '<div class="mbars">' + rows.map(r =>
    '<div class="mbar' + (r.m === now ? ' on' : '') + '" data-go-month="' + r.m + '">' +
    '<span class="ml">' + esc(shortMonth(r.m)) + '</span>' +
    '<span class="mt"><i style="width:' + (r.total / top * 100).toFixed(1) + '%"></i></span>' +
    '<span class="mv num">' + esc(money(r.total)) + '</span></div>').join('') + '</div>';
}

function renderSpend(){
  const m = S.month, f = monthFigures(m);
  const rows = f.spendRows.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const byCat = {};
  for(const s of rows) byCat[s.cat||'Other'] = (byCat[s.cat||'Other']||0) + toNum(s.amount);
  const cats = Object.keys(byCat).sort((a,b) => byCat[b] - byCat[a]);
  const days = new Date(Number(m.slice(0,4)), Number(m.slice(5,7)), 0).getDate();
  /* How much of the month is behind us. On the first or second of a month a
     rate a day is one expense divided by one day, and projecting it forward
     produces a month-end figure several times the year's income — which is
     how this was found. An expense dated later in the month counts too: money
     written down for the 20th has to be inside the elapsed span, or the rate
     is a division by a period that did not contain the spending. */
  const lastEntry = f.spendRows.reduce((d,r) =>
    Math.max(d, Number((r.date||'').slice(8,10)) || 0), 0);
  const elapsed = (m === thisMonth())
    ? Math.min(days, Math.max(new Date().getDate(), lastEntry))
    : days;
  const rateWorthQuoting = elapsed >= 5 && f.spend > 0;

  let h = '<div class="card"><h2>' + esc(monthName(m)) + '</h2>' +
    kv('Fixed outgoings', esc(money(f.fixed))) +
    kv('Day-to-day spending', esc(money(f.spend))) +
    kv('Together', esc(money(f.fixed + f.spend)), 'tot') +
    (rateWorthQuoting
      ? '<div class="work">Day-to-day is running at ' +
        esc(money(f.spend / elapsed)) + ' a day over ' + elapsed + ' days; at ' +
        'that rate the month finishes at ' +
        esc(money(f.spend / elapsed * days)) + '.</div>'
      : '<div class="work">Too little of the month has gone by to read a rate ' +
        'a day into it.</div>') +
    '<div class="row wrap" style="margin-top:10px;gap:6px">' +
    '<button class="btn sm" data-add="spend">Add expense</button>' +
    '<button class="btn sec sm" data-add="fixed">Add fixed outgoing</button></div></div>';

  /* One tap to file. Five taps at a shop counter is how a ledger stops being
     filled in, and once it stops being filled in every other figure in this
     app is fiction. The amount stays put between entries; the category files
     it. Undo is here because one tap is easy to mistap. */
  h += '<div class="card"><h2>Quick add</h2>' +
    '<input id="qAmt" type="number" inputmode="decimal" step="0.01" ' +
      'placeholder="Amount" value="" style="font-size:20px">' +
    '<div class="row wrap" style="margin-top:8px;gap:6px">' +
    quickCats().map(c => '<button class="btn sec sm" data-qcat="' + esc(c) + '">' +
      esc(c) + '</button>').join('') + '</div>' +
    (LAST_ADD
      ? '<div class="kv" style="margin-top:8px"><span class="k">Added ' +
        esc(money(toNum(LAST_ADD.amount))) + ' &middot; ' + esc(LAST_ADD.cat) +
        '</span><span><button class="btn sec sm" data-undoadd="1">Undo</button>' +
        '</span></div>'
      : '<div class="work">Type the amount, tap the category. It files for ' +
        'today. For a different date or a note, use Add expense.</div>') +
    '</div>';

  h += '<div class="card"><h2>Find an expense</h2>' +
    '<input id="qFind" type="search" placeholder="Diesel, Car, 4200…" value="' +
      esc(SPEND_Q) + '">' +
    (SPEND_Q.trim()
      ? (() => {
          const hits = spendSearch(SPEND_Q);
          const sum = hits.reduce((a,x) => a + toNum(x.amount), 0);
          return kv(hits.length + ' found, across every month', esc(money(sum)), 'tot') +
            (hits.length
              ? hits.slice(0,60).map(x => '<div class="kv" data-edit="spend" data-id="' +
                  x.id + '"><span class="k">' + esc(fmtDate(x.date)) + ' · <strong>' +
                  esc(x.cat||'Other') + '</strong>' + (x.note ? ' · ' + esc(x.note) : '') +
                  '</span><span class="num">' + esc(money(toNum(x.amount))) +
                  '</span></div>').join('') +
                (hits.length > 60 ? '<div class="work">Showing the newest 60.</div>' : '')
              : '<div class="empty">Nothing matches.</div>');
        })()
      : '<div class="work">Searches the note, the category and the exact ' +
        'amount, across every month you have ever recorded.</div>') +
    '</div>';

  {
    const rows = monthTotals(12);
    if(rows.some(r => r.total > 0)){
      const withSpend = rows.filter(r => r.total > 0);
      const avg = withSpend.reduce((a,r) => a + r.total, 0) / withSpend.length;
      const thisOne = rows[rows.length-1];
      h += '<div class="card"><h2>Month by month</h2>' + monthBars(rows) +
        kv('Average of the months with anything in them', esc(money(avg))) +
        kv(shortMonth(thisOne.m) + ' against that average',
           '<span class="' + (thisOne.total > avg ? 'neg' : 'pos') + '">' +
           esc(money(thisOne.total - avg)) + '</span>', 'tot') +
        '<div class="work">Fixed outgoings and day-to-day together. Tap a ' +
        'month to open it. The current month is still filling up, so it reads ' +
        'low until the end of it.</div></div>';
    }
  }

  h += '<div class="card"><h2>Fixed outgoings</h2>' +
    (DB.fixed.length ? DB.fixed.map(x => {
      const due = dueIn(x, m);
      return '<div class="kv" data-edit="fixed" data-id="' + x.id + '">' +
        '<span class="k">' + esc(x.name||'—') + ' <span class="chip">' +
        esc((FREQ[x.freq]||FREQ.monthly).label) + '</span>' +
        (due ? ' <span class="chip warn">due</span>' : '') + '</span>' +
        '<span class="num">' + esc(money(toNum(x.amount))) + '</span></div>';
    }).join('') : '<div class="empty">Rent, insurance, fees — the ones that arrive whether you look or not.</div>') +
    '</div>';

  if(cats.length){
    h += '<div class="card"><h2>By category</h2>' +
      donut(cats.map(c => ({label:c, value:byCat[c]})), 'spent', money(f.spend)) +
      '</div>';
  }

  h += '<div class="card"><h2>Every expense in ' + esc(shortMonth(m)) + '</h2>' +
    (rows.length ? rows.map(s => '<div class="kv" data-edit="spend" data-id="' + s.id + '">' +
      '<span class="k">' + esc(fmtDate(s.date)) + ' · <strong>' + esc(s.cat||'Other') +
      '</strong>' + (s.note ? ' · ' + esc(s.note) : '') + '</span>' +
      '<span class="num">' + esc(money(toNum(s.amount))) + '</span></div>').join('')
      : '<div class="empty">Nothing spent this month, or nothing written down.</div>') +
    '</div>';

  el('tab-spend').innerHTML = h;
}

/* Every price in one go. Typing them one holding at a time through the record
   editor is six screens and a lot of tapping, which is how prices end up
   months old and the whole portfolio figure quietly stops meaning anything. */
function pricesEditor(){
  const list = DB.invest.filter(h => !h.closed && PRICED[h.kind]);
  if(!list.length){ alert('Nothing priced to update yet — add a share, a fund or a bond first.'); return; }
  const fields = [
    { k:'asof', label:'Prices as at', type:'date' },
    { k:'n', type:'note', label:'Leave a box empty to leave that one alone. ' +
      'Every figure is kept with its date, which is what the little lines on ' +
      'the cards are drawn from.' }
  ];
  const rec = { asof: today() };
  for(const h of list){
    fields.push({ k:'p_' + h.id, type:'money',
      label:(h.name || KINDS[h.kind]) + (h.code ? ' · ' + h.code : ''),
      hint:'was ' + money(toNum(h.price) || toNum(h.buy), 2) +
           (h.asof ? ' on ' + fmtDate(h.asof) : '') });
    rec['p_' + h.id] = toNum(h.price) || '';
  }
  editor('Update prices', fields, rec, r => {
    let n = 0;
    for(const h of list){
      const v = r['p_' + h.id];
      if(v === '' || v === undefined || !(toNum(v) > 0)) continue;
      if(toNum(v) === toNum(h.price) && h.asof === r.asof) continue;
      h.price = toNum(v);
      h.asof  = r.asof;
      stamp(h); notePrice(h); n++;
    }
    if(!n){ alert('Nothing changed.'); return; }
    if(save('invest')){ noteSnapshot(); render(); }
  }, null);
}
