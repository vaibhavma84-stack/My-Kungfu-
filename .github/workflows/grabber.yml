name: Build Grabber APK

on:
  push:
    paths:
      - "grabber/**"
      - ".github/workflows/grabber.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: grabber
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NAME: v${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # A wrongly signed APK builds green, installs nowhere useful, and only
      # fails on the phone -- where the fix is uninstalling, which wipes the
      # download history. So the signature is checked before anything ships.
      - name: Check the APK is signed by the expected key
        working-directory: grabber
        run: |
          python3 verify-signing.py \
            app/build/outputs/apk/debug/app-debug.apk \
            grabber-debug.keystore android

      - name: Report the APK size
        working-directory: grabber
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Grabber-apk
          path: grabber/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions artifacts are zipped and need a signed-in browser, which the
      # GitHub mobile app cannot do. A release asset on a public repository is
      # a plain direct download, so the phone can fetch the APK itself.
      #
      # The tag is "grabber-latest", never "latest". The deck log owns "latest"
      # in this repository and deletes it before publishing each of its own
      # builds -- publishing there would destroy the deck log's release, and
      # the delete below would eventually take it out entirely. Two apps
      # sharing one repository have to keep their tags apart.
      - name: Publish the APK as the Grabber release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp grabber/app/build/outputs/apk/debug/app-debug.apk Grabber.apk
          gh release delete grabber-latest --yes --cleanup-tag || true
          gh release create grabber-latest Grabber.apk \
            --target "${GITHUB_SHA}" \
            --title "Grabber v${{ github.run_number }}" \
            --notes "Android video downloader — a different app from the Deck Log, which lives in this same repository under its own \`latest\` release.

          Build v${{ github.run_number }} from ${{ github.sha }}.

          **Install:** tap \`Grabber.apk\` below, then allow installing from this source when Android asks. Built for arm64 phones.

          Every build is signed with the same key, so this installs as an upgrade over any previous copy and keeps your download history.

          **Not yet run on a real phone.** It compiles and the signature is verified, but no device or emulator was available to test it on. Expect a few seconds of silence on first launch while the bundled Python engine unpacks."
