name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the current app page inside the APK
        run: cp index.html android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the build number the page reports
        id: ver
        run: |
          name=$(grep -o "APP_BUILD = '[^']*'" index.html | head -1 | cut -d"'" -f2)
          echo "name=${name:-dev}" >> "$GITHUB_OUTPUT"
          echo "Page reports build: ${name:-dev}"

      - name: Build debug APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NAME: ${{ steps.ver.outputs.name }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK by date
        id: name
        run: echo "stamp=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DeckLog-${{ steps.name.outputs.stamp }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions artifacts are zipped and need a signed-in browser, which the
      # GitHub mobile app cannot do. A release asset is a plain direct download,
      # so the phone can fetch the APK itself from a fixed URL.
      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DeckLog.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DeckLog.apk \
            --title "Deck Log ${{ steps.ver.outputs.name }}" \
            --notes "Build ${{ steps.ver.outputs.name }} (versionCode ${{ github.run_number }}), from ${{ github.sha }} on ${{ steps.name.outputs.stamp }}.

          Check it installed: the version at the foot of the app should read ${{ steps.ver.outputs.name }}.

          Install straight from the phone: tap DeckLog.apk below, then allow
          installing from this source when Android asks." 
