name: Build MV Tagger APK

on:
  push:
    paths:
      - 'mvtagger/**'
      - '.github/workflows/mvtagger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvtagger

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The tagging, filename parsing and matching all live in :core, which is a
      # plain JVM module. Running its tests first means a broken MP4 writer is
      # caught here rather than on a phone, with a video that no longer plays.
      - name: Test the core
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :core:test --no-daemon --stacktrace

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_NAME: v${{ github.run_number }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # Same reasoning as the other app in this repo: a wrongly signed APK
      # builds green and only fails on the phone, where the fix is to uninstall
      # first -- which throws away the library and every setting with it.
      - name: Check the APK is signed by the expected key
        working-directory: .
        run: |
          python3 android/verify-signing.py \
            mvtagger/app/build/outputs/apk/debug/app-debug.apk \
            mvtagger/mvtagger-debug.keystore android

      - name: Name the APK by date
        id: name
        run: echo "stamp=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MVTagger-${{ steps.name.outputs.stamp }}-apk
          path: mvtagger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An Actions artifact is a zip behind a sign-in, which a phone browser
      # cannot get at. A release asset is a plain direct download, so the phone
      # can fetch the APK itself from a fixed URL.
      - name: Publish the APK for installing on the phone
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mvtagger/app/build/outputs/apk/debug/app-debug.apk MVTagger.apk
          gh release delete mvtagger-latest --yes --cleanup-tag || true
          gh release create mvtagger-latest MVTagger.apk \
            --title "MV Tagger v${{ github.run_number }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "Build v${{ github.run_number }}, from ${{ github.sha }} on ${{ steps.name.outputs.stamp }}.

          Install straight from the phone: tap MVTagger.apk below, then allow
          installing from this source when Android asks.

          It installs alongside Deck Log -- different app, different data, and
          neither one touches the other."
